machine_readable: >-
  The pricing page embeds schema.org SoftwareApplication offers as application/ld+json, so the
  headline monthly prices below are read from a machine-readable source on AWeber's own page,
  not scraped from rendered copy. The annual-billing figures are from the rendered plan cards.
currency: USD
plan_count: 3
billing_periods: [monthly, annual]
trial:
  days: 14
  credit_card_required: true
  note: >-
    "Try AWeber free with a 14-day trial." The page also carries a "Get AWeber Free" CTA in the
    site header; the pricing table itself lists no perpetual free tier, so a free plan is NOT
    recorded here.
api_access:
  gated: false
  note: >-
    The REST API is not sold as a plan add-on and is not listed as a plan feature. API access
    requires a free AWeber Labs developer account (https://labs.aweber.com) plus an AWeber
    customer account whose data the application is authorized against. No plan tier or price is
    attached to API calls, and the 120 req/min limit is per customer account regardless of tier.
