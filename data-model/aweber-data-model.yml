  resource-map narrative at https://api.aweber.com/#tag/Getting-Started
model: hypermedia-entry-collection
note: >-
  AWeber's object graph is explicitly hypermedia: every Entry carries self_link plus a
  *_collection_link for each child collection and a *_link for each single related entry, and
  the documentation instructs clients to traverse those links rather than construct paths. The
  relationships below are read straight off those link fields, so this ERD is the provider's own
  wiring, not an inference from naming. There is no id-prefix scheme (ids are bare integers;
  Account, List and Subscriber additionally carry a uuid).
root: Account
entities:
  - name: Account
    id: integer (plus uuid since 2021-02-18)
    fields: [id, uuid, company, analytics_src, http_etag, self_link, resource_type_link]
    operations: [getAccounts, getAccount]
  - name: List
    id: integer (plus uuid and unique_list_id)
    fields: [id, uuid, name, unique_list_id, vapid_public_key, total_subscribers, total_subscribed_subscribers, total_unconfirmed_subscribers, total_unsubscribed_subscribers, total_subscribers_subscribed_today, total_subscribers_subscribed_yesterday]
    operations: [getLists, getList, findLists]
  - name: Subscriber
    id: integer (plus uuid since 2021-11-17)
    fields: [id, email, name, status, is_verified, custom_fields, tags, ad_tracking, misc_notes, ip_address, city, region, country, postal_code, area_code, dma_code, latitude, longitude, last_followup_message_number_sent, last_followup_sent_at]
    operations: [getSubscribers, getSubscriber, addSubscriber, updateSubscriberByID, updateSubscriberByEmail, deleteSubscriberByID, deleteSubscriberByEmail, moveSubscriber, findSubscribersForList, findSubscribersForAccount]
    status_enum: [subscribed, unconfirmed, unsubscribed]
  - name: Broadcast
    id: broadcast_id
    fields: [broadcast_id, subject, body_html, body_text, body_amp, is_archived, archive_url, click_tracking_enabled, include_lists, exclude_lists, segment_link, segment_name, scheduled_for, sent_at, created_at, notify_on_send, stats, facebook_integration, twitter_integration]
    operations: [getBroadcasts, getBroadcast, createBroadcast, updateBroadcast, deleteBroadcast, scheduleBroadcast, cancelScheduledBroadcast, getTotalBroadcasts, getBroadcastOpens, getBroadcastClicks]
  - name: Campaign
    id: integer (addressed as {campaignType}{campaignId}, e.g. b123 for broadcast, f123 for follow-up)
    fields: [id, campaign_type, subject, content_type, message_number, message_interval, scheduled_at, sent_at, is_archived, spam_assassin_score, total_sent, total_opens, total_clicks, total_undelivered, total_unsubscribes, total_spam_complaints]
    operations: [getCampaigns, getCampaign, findCampaigns, getBroadcastStatistics, getBroadcastStatistic]
  - name: CustomField
    id: integer
    fields: [id, name, is_subscriber_updateable]
    operations: [getCustomFields, getCustomField, addCustomField, updateCustomField, deleteCustomField]
  - name: Segment
    id: integer
    operations: [getSegments, getSegment]
  - name: WebForm
    id: integer
    operations: [getWebformsForList, getWebformForList, getWebformsForAccount]
  - name: WebFormSplitTest
    id: integer
    operations: [getSplitTestsForList, getSplitTestForList, getSplitTestsForAccount]
  - name: WebFormSplitTestComponent
    id: integer
    operations: [getSplitTestComponents, getSplitTestComponent]
  - name: LandingPage
    id: integer
    operations: [getLandingPages, getLandingPage]
  - name: Integration
    id: integer
    fields: [id, login, service_name]
    operations: [getIntegrations, getIntegration]
  - name: Message
    id: integer
    fields: [id, type, event_time, last_opened, total_opens]
  - name: Open
    id: integer
  - name: Click
    id: integer
    fields: [id, type, event_time, is_earliest]
  - name: Link
    id: integer
    fields: [id, url, total_clicks, total_unique_clicks]
  - name: TrackedEvent
    id: integer
  - name: Activity
    id: integer
    note: Polymorphic union of SentMessageActivity, OpenActivity, ClickActivity, LinkActivity, SubscribedActivity, TrackedEventActivity.
  - name: Purchase
    id: null
    fields: [event_time, product_name, value, currency, vendor, url, event_note, email, name, ip_address, ad_tracking, misc_notes, custom_fields, tags]
    operations: [createAPurchase]
    note: Write-only tracked event; creates the subscriber if absent.
  - name: Stat
    id: integer
    fields: [id, description, value]
relationships:
