  - {from: Campaign, to: Link, type: has_many, via: links_collection_link}
  - {from: Link, to: Click, type: has_many, via: clicks_collection_link}
  - {from: Message, to: Open, type: has_many, via: opens_collection_link}
  - {from: Message, to: TrackedEvent, type: has_many, via: tracked_events_collection_link}
  - {from: Message, to: Subscriber, type: belongs_to, via: subscriber_link}
  - {from: Open, to: Subscriber, type: belongs_to, via: subscriber_link}
  - {from: Click, to: Subscriber, type: belongs_to, via: subscriber_link}
