collection_envelope:
  fields: [entries, start, total_size, next_collection_link, prev_collection_link, resource_type_link]
  note: >-
    Some collections expose total_size_link (a link that resolves to the count) instead of an
    inline total_size — notably the find* operations. Clients must handle both.
