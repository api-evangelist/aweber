standards:
  - id: openapi-3.0
    conforms: true
    evidence: >-
      AWeber publishes a real multi-file OpenAPI 3.0.2 at https://api.aweber.com/swagger.yaml
      (rendered by Redocly at https://api.aweber.com/). 45 paths / 57 operations, full component
      schemas, parameters and responses, and x-codeSamples in six languages.
  - id: oauth2
    conforms: true
    evidence: >-
      securitySchemes declares an oauth2 authorizationCode flow with authorize, token and refresh
      URLs on auth.aweber.com and nine named scopes.
  - id: rfc6749-oauth2-authorization-code
    conforms: true
    evidence: Documented authorization-code flow with state, refresh tokens and a revoke endpoint.
  - id: rfc7636-pkce
    conforms: true
    evidence: >-
      PKCE is REQUIRED for public clients and forbidden for confidential clients; both violations
      are named error cases in the troubleshooting reference.
  - id: rfc7009-token-revocation
    conforms: true
    evidence: POST /oauth2/revoke is published as a first-class operation.
  - id: rfc8414-authorization-server-metadata
    conforms: false
    evidence: >-
      /.well-known/oauth-authorization-server returns 404 on auth.aweber.com and on every other
      AWeber host (see well-known/aweber-well-known.yml). Endpoint discovery is documentation-only.
  - id: oidc
    conforms: false
    evidence: No OpenID Connect discovery document and no id_token; OAuth 2.0 is used for API authorization only.
  - id: oauth1a
    conforms: true
    evidence: >-
      Legacy OAuth 1.0a request-token and access-token endpoints remain published and live, though
      AWeber requires OAuth 2.0 for all new applications.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors use a custom {"error": {status, message, type, documentation_url}} envelope with
      Content-Type application/json, not application/problem+json.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: No Sunset or Deprecation header support and no published deprecation policy.
  - id: rfc9116-security-txt
    conforms: false
    evidence: /.well-known/security.txt returns 404 on all four AWeber hosts.
  - id: idempotency-key
    conforms: false
    evidence: No idempotency key header or request-deduplication contract is published.
  - id: rfc2104-hmac
    conforms: true
    evidence: >-
      Webhook callbacks are signed with HMAC-SHA256 and delivered in the AWeber-Signature header
      as "sha256=<digest>"; AWeber cites RFC 2104 directly.
  - id: asyncapi
    conforms: false
    evidence: A documented webhook surface exists but no AsyncAPI document is published.
  - id: json-api
    conforms: false
