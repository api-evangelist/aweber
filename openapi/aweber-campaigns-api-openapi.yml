    UnauthorizedError:
      description: The request could not be completed due to an authentication error
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/schemas/Endpoint Error'
            - $ref: '#/schemas/Auth Error'
  schemas:
    Campaign:
      properties:
        campaign_type:
          description: 'Type of campaign. (f: followup, b: broadcast)'
          type: string
          enum:
          - b
          - f
        click_tracking_enabled:
          description: Whether click tracking is enabled
          type: boolean
        content_type:
          description: Type of message
          type: string
          enum:
          - Text
          - HTML
          - Text/HTML
        id:
          description: Unique campaign ID for followup or broadcast
          type: integer
          example: 1234567
        is_archived:
          description: Is the campaign in the campaign archive (broadcast only)
          type: boolean
        links_collection_link:
          description: A URL to retrieve the [Links](#tag/Campaigns/paths/~1accounts~1{accountId}~1lists~1{listId}~1campaigns~1{campaignType}{campaignId}~1links/get)
            for this campaign
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns/b3456789/links
        message_interval:
          description: Message interval (followup only)
          type: integer
          minimum: 1
          maximum: 999
        message_number:
          description: Followup sequence number (followup only)
          type: integer
          minimum: 1
          maximum: 999
        resource_type_link:
          description: A link that identifies the type of resource that this collection represents
          type: string
          format: uri
          example: https://api.aweber.com/1.0/#broadcast_campaign
        scheduled_at:
          description: When broadcast is scheduled to send (broadcast only)
          type: string
          format: date-time
          example: '2017-07-18 16:53:02-04:00'
        self_link:
          description: The link to this resource
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns/b3456789
        sent_at:
          description: Date/Time campaign was sent (broadcast only)
          type: string
          format: date-time
          example: '2017-07-18 16:53:07-04:00'
        spam_assassin_score:
          description: "SpamAssassin score.  Read <a href=\"https://blog.aweber.com/email-deliverability/spamassassin-deliverability-tips.htm\"\
            \n target=\"_blank\">SpamAssassin's Tips on Deliverability</a> for more detail."
          type: number
          format: float
          example: 2.1
        stats_collection_link:
          description: A link to the [statistics collection](#tag/Campaigns/paths/~1accounts~1{accountId}~1lists~1{listId}~1campaigns~1b{campaignId}~1stats/get)
            for this campaign
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/accounts/123/lists/456/campaigns/b3456789/stats
        subject:
          description: Subject of message
          type: string
          maximum: 120
          example: Weekly Recipes
        total_clicks:
          description: Total clicks of this message
          type: integer
        total_opens:
          description: Total number of messages opened
          type: integer
        total_sent:
          description: Total number of messages sent
          type: integer
        total_spam_complaints:
          description: Total number of spam complaints received
          type: integer
        total_undelivered:
          description: Total number of undeliverable messages
          type: integer
        total_unsubscribes:
          description: Total number of unsubscribes from this campaign
          type: integer
        twitter_account_link:
          description: Twitter account where broadcast was tweeted (broadcasts only). Links to [Integration](#tag/Integrations/paths/~1accounts~1{accountId}~1integrations~1{integrationId}/get).
          type: string
          format: uri
          example: https://api.aweber.com/1.0/account/123/integrations/456
    FindCampaigns:
      type: object
      properties:
        entries:
          description: A list of campaign entries
          type: array
          items:
            $ref: '#/definitions/Campaign'
        next_collection_link:
          description: A link to the next page of entries if more entries exist. This attribute is omitted
            from the collection if there are no more entries.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns?ws.start=101&ws.size=100
        prev_collection_link:
          description: A link to the previous page of entries if any exist. This attribute is omitted
            from the collection if ws.start is 0.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns?ws.start=0&ws.size=100
        start:
          description: The starting offset for the page of entries to retrieve
          type: integer
          minimum: 0
        total_size_link:
          description: Link to the total number of entries
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns?campaign_type=b&ws.op=find&ws.show=total_size
    ListCampaigns:
      type: object
      properties:
        entries:
          description: A list of campaign entries
          type: array
          items:
            $ref: '#/definitions/Campaign'
        next_collection_link:
          description: A link to the next page of entries if more entries exist. This attribute is omitted
            from the collection if there are no more entries.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns?ws.start=101&ws.size=100
        prev_collection_link:
          description: A link to the previous page of entries if any exist. This attribute is omitted
            from the collection if ws.start is 0.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns?ws.start=0&ws.size=100
        start:
          description: The starting offset for the page of entries to retrieve
          type: integer
          minimum: 0
        total_size:
          description: The total number of entries
          type: integer
    Stat:
      type: object
      properties:
        description:
          description: A description of the statistic
          type: string
          example: total number of times a subscriber clicked any link appearing in your campaign except
            the unsubscribe link (includes multiple clicks of the same link)
        id:
          description: Statistic's ID
          type: string
          example: total_clicks
        resource_type_link:
          description: A link that identifies the type of resource that this represents
          type: string
          format: uri
          enum:
          - integer_stat
          - decimal_stat
          - list_stat
          example: https://api.aweber.com/1.0/#integer_stat
        self_link:
          description: The link to this resource
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns/b789/stats/total_clicks
        value:
          description: 'The statistic''s value


            The datatype of the value attribute may be different for each Stat.

            Stats can be integer_stat, decimal_stat, or list_stat. Evaluate the

            resource_type_link attribute if you must programmatically handle

            different datatypes in a special way.


            Below is a list of the statistics ID and return type


            >

            > __Aggregate Statistics__

            >

            > * total_clicks - integer_stat

            > * unique_clicks - integer_stat

            > * total_opens - integer_stat

            > * unique_opens - integer_stat

            > * total_sales - integer_stat

            > * total_sales_dollars - decimal_stat

            > * total_unsubscribed - integer_stat


            > __Time Related Statistics__

            >

            > * hourly_opens - list_stat

            > * hourly_clicks - list_stat

            > * hourly_webhits - list_stat

            > * hourly_sales - list_stat

            > * hourly_unsubscribes - list_stat

            > * daily_opens - list_stat

            > * daily_clicks - list_stat

            > * daily_webhits - list_stat

            > * daily_sales - list_stat

            > * daily_unsubscribes - list_stat


            > __Top 10 URL Statistics__

            >

            > * clicks_by_link - list_stat

            > * webhits_by_link - list_stat


            >  __Top 10 Subscriber Statistics__ (Requires access to subscriber data)

            >

            > * opens_by_subscriber - list_stat

            > * sales_by_subscriber - list_stat

            '
          oneOf:
          - type: integer
          - type: number
          - type: string
          example: 21
    Stats:
      type: object
      properties:
        entries:
          description: A list of stats entries
          type: array
          items:
            $ref: '#/definitions/Stat'
        next_collection_link:
          description: A link to the next page of entries if more entries exist. This attribute is omitted
            from the collection if there are no more entries.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns/b789/stats?ws.start=2&ws.size=1
        prev_collection_link:
          description: A link to the previous page of entries if any exist. This attribute is omitted
            from the collection if ws.start is 0.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns/b789/stats?ws.start=0&ws.size=1
        resource_type_link:
          description: A link that identifies the type of resource that this represents
          type: string
          format: uri
          example: https://api.aweber.com/1.0/#stat-page-resource
        start:
          description: The starting offset for the page of entries to retrieve
          type: integer
          minimum: 0
          example: 1
        total_size:
          description: The total number of entries
          type: integer
          example: 10
  securitySchemes:
    OAuth 2.0:
      description: 'The following endpoints and scopes are used to authenticate.

        '
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.aweber.com/oauth2/authorize
          tokenUrl: https://auth.aweber.com/oauth2/token
          refreshUrl: https://auth.aweber.com/oauth2/token
          scopes:
            account.read: '<br>

              Access account information and associated integrations. <br>

              <b>Required for the following endpoints:</b> get accounts, get account, get integrations,
              get integration

              '
            landing-page.read: '<br>

              Retrieve landing pages <br>

              <b>Required for the following endpoints:</b> get landing pages, get landing page

              '
            list.read: '<br>

              Retrieve lists, custom fields, tags, and sign up forms <br>

              <b>Required for the following endpoints:</b> get list, get lists, find lists, get tags for
              list, get custom fields, get custom field, get webforms for list, get split tests for list,
              get split test components, get split test component, get webforms for account, get split
              tests for account

              '
            list.write: '<br>

              Create, edit, and delete custom fields <br>

              <b>Required for the following endpoints:</b> add custom field, update custom field, delete
              custom field

              '
            subscriber.read: '<br>

              Retrieve subscribers and their activity <br>

              <b>Required for the following endpoints:</b> get subscribers, get subscriber, get subscriber
              activity, get subscribers for message, find subscribers for account, find subscribers for
              list

              '
            subscriber.write: '<br>

              Create, edit, delete, retrieve, search for, and move subscribers <br>

              <b>Required for the following endpoints:</b> add subscriber, move subscriber, update subscriber,
              delete subscriber

              '
            subscriber.read-extended: '<br>

              Previously required to retrieve subscriber PII such as name, email, IP address, etc.  This
              functionality was moved to the "subscriber.read" scope

              '
            email.read: '<br>

              Retrieve email activity related to broadcasts and follow-ups <br>

              <b>Required for the following endpoints:</b> get messages, get message, get broadcasts,
              get broadcast, get message opens, get message open, get message tracked events, get message
              tracked event, get total broadcasts, get campaigns, get campaign, find campaigns, get broadcast
              statistics, get broadcast statistic

              '
            email.write: '<br>

              Create and send email broadcasts <br>

              <b>Required for the following endpoints:</b> create broadcast, update broadcast, delete
              broadcast, cancel broadcast, schedule broadcast

              '
