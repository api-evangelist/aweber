components:
  parameters:
    accountId:
      name: accountId
      in: path
      description: The account ID
      required: true
      schema:
        type: integer
        format: int32
    campaignId:
      name: campaignId
      required: true
      in: path
      description: The campaign ID
      schema:
        type: integer
        format: int32
    campaignType:
      name: campaignType
      in: path
      description: The campaign type (b - broadcast, f - followup)
      required: true
      schema:
        type: string
        enum:
        - b
        - f
    listId:
      name: listId
      in: path
      description: The list ID
      required: true
      schema:
        type: integer
        format: int32
    statsId:
      name: statsId
      required: true
      in: path
      description: '<br>


        >The statistic''s ID.

        >

        >The datatype of the ID may be different for each Stat.

        >

        >Below is a list of the statistic IDs that can be passed in.

        >

        >__Aggregate Statistics__

        >

        >| Stat ID | Description |

        >|---------|-------------|

        >| total_clicks | Total number of times a subscriber clicked any link appearing in your campaign
        except the unsubscribe link (includes multiple clicks of the same link) |

        >| unique_clicks | Total number of subscribers who clicked any link in your campaign |

        >| total_opens | Total number of times your campaign was opened by any subscriber your campaign
        was sent to (including multiple opens by the same subscriber) |

        >| unique_opens | Total number of subscribers who opened your campaign |

        >| total_sales | Total number of sales made by subscribers who received your campaign |

        >| total_sales_dollars | Total monetary value of sales made by subscribers who received your campaign
        |

        >| total_unsubscribed | Total number of subscribers who unsubscribed by clicking the unsubscribe
        link in your campaign |

        >

        >__Time Related Statistics__

        >

        >| Stat ID | Description |

        >|---------|-------------|

        >| hourly_clicks | Hourly breakdown of unique and total clicks for the first 24 hours after a
        campaign was sent |

        >| hourly_opens | Hourly breakdown of unique and total opens for the first 24 hours after a campaign
        was sent |

        >| hourly_sales | Hourly breakdown of sales for the first 24 hours after a campaign was sent |

        >| hourly_unsubscribed | Hourly breakdown of subscribers who unsubscribed by clicking the unsubscribed
        link for the first 24 hours after a campaign was sent |

        >| hourly_webhits | Hourly breakdown of webhits to your website from subscribers sent this message
        for the first 24 hours after a campaign was sent |

        >| daily_clicks | Daily breakdown of unique and total clicks for the first 14 days after a campaign
        was sent |

        >| daily_opens | Daily breakdown of unique and total opens for the first 14 days after a campaign
        was sent |

        >| daily_sales | Daily breakdown of sales for the first 14 days after a campaign was sent |

        >| daily_unsubscribed | Daily breakdown of subscribers who unsuscribed by clicking the unsubscribed
        link for the first 14 days after a campaign was sent |

        >| daily_webhits | Daily breakdown of webhits to your website from subscribers sent this message
        for the first 14 days after a campaign was sent |

        >

        >__Top 10 URL Statistics__

        >

        >| Stat ID | Description |

        >|---------|-------------|

        >| clicks_by_link | Top 10 links that were clicked (ranked by total_clicked) |

        >| webhits_by_link | Top 10 webhits by click (ranked by total clicks) |

        >

        >__Top 10 Subscriber Statistics__

        >(Requires access to subscriber data)

        >

        >| Stat ID | Description |

        >|---------|-------------|

        >| opens_by_subscriber | Top 10 subscribers that opened your message (ranked by total opens) |

        >| sales_by_subscriber | Top 10 subscribers that made a sale from your message (ranked by total
        sales dollars) |

        '
      schema:
        type: string
        enum:
        - total_clicks
        - unique_clicks
        - total_opens
        - unique_opens
        - total_sales
        - total_sales_dollars
        - total_unsubscribed
        - hourly_opens
        - hourly_clicks
        - hourly_webhits
        - hourly_sales
        - hourly_unsubscribed
        - daily_opens
        - daily_clicks
        - daily_webhits
        - daily_sales
        - daily_unsubscribed
        - clicks_by_link
        - webhits_by_link
        - opens_by_subscriber
        - sales_by_subscriber
    wsShow:
      name: ws.show
      in: query
      description: A flag to show the total size only - expecting \"total_size\", when added the response
        will be an integer
      schema:
        type: string
        enum:
        - total_size
    wsSize:
      name: ws.size
      in: query
      description: The pagination total entries to retrieve
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 100
    wsStart:
      name: ws.start
      in: query
      description: The pagination starting offset
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
