    \ target=\"_blank\">AWeber Developer Newsletter</a>\n<br><br>\n\n## Webhooks\n\n### **Version 1.3.0**\n\
    ------------\n#### Release Date: Jun 21, 2022\n- Webhook support no longer requires a request to the\
    \ API team.  They can be enabled for any OAuth 2 application on labs.aweber.com.\n\n### **Version\
