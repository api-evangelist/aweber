    \ 14, 2020\n- Added support for imports and large batches.\n\n### **Version 1.1.0**\n------------\n\
    #### Release Date: Jan 3, 2020\n- Added webhooks for `subscriber.subscribed` and `subscriber.unsubscribed`\
    \ events.\n\n### **Version 1.0.0**\n------------\n#### Release Date: Nov 26, 2019\n- Added webhooks\
    \ support. The first webhook offered is a `subscriber.added` event.\n\n## API\n\n### **Version 1.4.0**\n\
    #### Release Date: September 5, 2025\n- Introduces **beta endpoints** accessible at `api.aweber.com/2.0-beta/`.\
    \ These endpoints are early-access versions of the upcoming v2 API and primarily focus on using UUIDs\
    \ instead of numeric IDs. The beta endpoints allow developers to preview and test new features and\
    \ changes before the official v2 release.\n\n### **Version 1.3.1**\n#### Release Date: August 22,\
    \ 2025\n- Adds support for retrieving detailed click data by passing the `detailed=true` query parameter\
    \ to the broadcast clicks endpoint.\n\n### **Version 1.3.0**\n#### Release Date: May 6, 2025\n- Removes\
    \ legacy campaign link and click endpoints.\n\n### **Version 1.2.3**\n------------\n#### Release Date:\
    \ Dec 27, 2023\n- Adds [410 error response][64] to list of possible API Responses\n- Replaces documentation\
    \ links in code examples from `labs.aweber.com/docs/troubleshooting`\n  to use `api.aweber.com`\n\n\
