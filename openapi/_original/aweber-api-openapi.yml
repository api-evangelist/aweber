    post:
      summary: Move subscriber
      description: "This endpoint is used to move a subscriber from one list to another on\nthe specified\
        \ account.  The subscriber will be unsubscribed from the original\nlist and subscribed to the\
        \ destination list without sending a verification\nmessage.  By default, the subscriber will be\
        \ set to the beginning of the\nfollowup sequence on the destination list.  You can explicitly\
        \ set the\nposition in the followup list by specifying the `last_followup_message_number_sent`\n\
        body parameter.\n\nIf either the source or destination list has custom fields defined, read our\n\
        <a href=\"https://help.aweber.com/hc/en-us/articles/360009520774\" target=\"_blank\">Knowledge\
        \ Base</a>\narticle.\n\n**Requirements**\n - the subscriber MUST have a status of \"subscribed\"\
        \n - the destination list MUST be owned by the same account as the source list\n\n\nCheck out\
        \ related examples:\n\n  * Find Subscribers Across Lists (\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/python/find-subscribers-across-lists\"\
        \ target=\"_blank\">Python</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/php/find-subscribers-across-lists\"\
        \ target=\"_blank\">PHP</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/postman/Find%20Subscribers%20Across%20Lists.postman_collection.json\"\
        \ target=\"_blank\">Postman</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/csharp/AWeber.Examples.FindSubscribersAcrossLists\"\
        \ target=\"_blank\">C#.NET</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/ruby/find_subscribers_across_lists.rb\"\
        \ target=\"_blank\">Ruby</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/node/find-subscribers-across-lists.js\"\
        \ target=\"_blank\">Node.js</a> )\n  * Manage Subscriber (\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/python/manage-subscriber\"\
        \ target=\"_blank\">Python</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/php/manage-subscriber\"\
        \ target=\"_blank\">PHP</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/postman/Manage%20Subscriber.postman_collection.json\"\
        \ target=\"_blank\">Postman</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/csharp/AWeber.Examples.ManageSubscriber\"\
        \ target=\"_blank\">C#.NET</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/ruby/manage_subscriber.rb\"\
        \ target=\"_blank\">Ruby</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/node/manage-subscriber.js\"\
        \ target=\"_blank\">Node.js</a> )\n  * Move Subscriber (\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/python/move-subscriber\"\
        \ target=\"_blank\">Python</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/php/move-subscriber\"\
        \ target=\"_blank\">PHP</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/postman/Move%20Subscriber.postman_collection.json\"\
        \ target=\"_blank\">Postman</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/csharp/AWeber.Examples.MoveSubscriber\"\
        \ target=\"_blank\">C#.NET</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/ruby/move_subscriber.rb\"\
        \ target=\"_blank\">Ruby</a> |\n    <a href=\"https://github.com/aweber/public-api-examples/blob/master/node/move-subscriber.js\"\
        \ target=\"_blank\">Node.js</a> )\n"
      tags:
      - Subscribers
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/listId'
      - $ref: '#/components/parameters/subscriberId'
      security:
      - OAuth 2.0:
        - subscriber.write
      x-code-samples:
      - lang: Shell
        source: "curl -X POST \\\n  https://api.aweber.com/1.0/accounts/{accountId}/lists/{listId}/subscribers/{subscriberId}\
          \ \\\n  -d ws.op=move \\\n  -d enforce_custom_field_mapping=true \\\n  -d last_followup_message_number_sent=0\
          \ \\\n  -d list_link=https://api.aweber.com/1.0/accounts/123/lists/456 \\\n  -H 'Authorization:\
          \ Bearer {YOUR_ACCESS_TOKEN}'\n"
      - lang: Python
        source: "body = {\n    'enforce_custom_field_mapping': True,\n    'last_followup_message_number_sent':\
          \ 0,\n    'list_link': 'https://api.aweber.com/1.0/accounts/123/lists/456',\n    'ws.op': 'move'\n\
          }\nheaders = {'Content-Type': 'application/x-www-form-urlencoded',\n           'Accept': 'application/json',\n\
          \           'User-Agent': 'AWeber-Python-code-sample/1.0',\n           'Authorization': f'Bearer\
          \ {access_token}'}\nurl = (f'https://api.aweber.com/1.0/accounts/{account_id}'\n       f'/lists/{list_id}/subscribers/{subscriber_id}')\n\
          response = requests.post(url, headers=headers, data=body)\nprint(response.headers['Location'])\n"
      - lang: PHP
        source: "$body = [\n    'enforce_custom_field_mapping' => true,\n    'last_followup_message_number_sent'\
          \ => 0,\n    'list_link' => 'https://api.aweber.com/1.0/accounts/123/lists/456',\n    'ws.op'\
          \ => 'move'\n];\n$headers = [\n    'Content-Type' => 'application/x-www-form-urlencoded',\n\
          \    'Accept' => 'application/json',\n    'Authorization' => 'Bearer $token',\n    'User-Agent'\
          \ => 'AWeber-PHP-code-sample/1.0'\n];\n$url = \"https://api.aweber.com/1.0/accounts/{$accountId}/lists/{$listId}/subscribers/{$subscriberId}\"\
          ;\n$response = $client->post($url, ['form_params' => $body, 'headers' => $headers]);\necho $response->getHeader('Location')[0];\n"
      - lang: C#
        source: "const string url = \"https://api.aweber.com/1.0/accounts/{accountId}/lists/{listId}/subscribers/{subscriberId}\"\
          ;\nvar payload = new Dictionary<string, string>\n{\n  {\"enforce_custom_field_mapping\", \"\
          true\"},\n  {\"last_followup_message_number_sent\", \"0\"},\n  {\"list_link\", \"https://api.aweber.com/1.0/accounts/123/lists/456\"\
          },\n  {\"ws.op\", \"move\"}\n};\nvar request = new HttpRequestMessage(HttpMethod.Post, url);\n\
          request.Content = new FormUrlEncodedContent(payload);\nrequest.Headers.Add(\"Accept\",\"application/json\"\
