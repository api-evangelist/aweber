- name: Webhooks
  description: "## Getting Started\n\nAWeber offers support for webhooks including `subscriber.added`,\
    \ `subscriber.subscribed` and `subscriber.unsubscribed`\nevents.  The integration will receive notifications\
    \ when the events occur for each AWeber User Account that is\nconnected.  The notifications are sent\
    \ to a callback URL that is configured by the AWeber User when they connect\nyour integration.  You\
    \ will need to provide the valid patterns for the URLs that your integration will receive\nnotifications\
    \ on.\n\nWhen you create or edit an integration, you enable webhooks by:\n\n1. providing one or more\
    \ URL prefixes as the **Callback URL Allow-list**\n2. selecting one or more events to be notified\
    \ for\n\nThe *Callback URL Allow-list* is the list of **exact** URL prefixes that can be configured\
    \ by the AWeber User\nwhen they connect their account to your integration.  For example, if the \"\
    allow list\" contains\n``https://example.com/api`` then customers can use any callback URL that starts\
    \ with ``https://example.com/api``\nincluding ``https://example.com/api/V1StGXR8_Z5jdHi6B-myT``, ``https://example.com/api/1A2E05D9-741D-4F1C-8937-6DFD984840ED``,\n\
    or even ``https://example.com/api-unexpected-suffix``.  *You usually want to end \"allow list\" entries\
    \ with an\nexplicit ``/`` to avoid that last one.*\n\n### Authorizing Webhooks[](#authorizing-webhooks)\n\
    \nTo authorize your webhooks-enabled integration, you will need to grant the\n`subscriber.read` and\
    \ `account.read` permissions from your AWeber User Account.\nFor more information about AWeber OAuth\
    \ scopes see\n<a href='https://help.aweber.com/hc/en-us/articles/360021487653' target='_blank'>here</a>.\n\
    \nOpen an OAuth 2.0 authorize URL in your browser:\n\n    https://auth.aweber.com/oauth2/authorize?client_id={client_id}&scope=subscriber.read%20account.read\n\
    \nReplace **{client_id}** with the Client ID of your webhooks-enabled integration. The Client ID\n\
    is available in your AWeber Developer account. The `scope` parameter may be any valid set of\nscopes\
    \ as long as it contains `subscriber.read` and `account.read`.\n\nYou may continue the OAuth 2.0 flow\
    \ to retrieve an access token if you need one. More detailed\ninstructions on OAuth 2.0 are available\n\
    <a href='https://help.aweber.com/hc/en-us/articles/360021258174' target='_blank'>here</a>.\n\n###\
    \ Providing a Callback URL\n\nOnce authorized, you must configure the callback URL for your webhooks-enabled\
    \ integration in\nthe AWeber control panel.  This is required to match a prefix in your integration's\
    \ **Callback URL Allow-list**.\n\nOpen this <a href='https://www.aweber.com/users/apps' target='_blank'>link</a>\
    \ in your browser.\n\nYou may be prompted to log in with your AWeber User Account (not your AWeber\
    \ Developer Account).\n\n<a href=\"/static/myapps.png\" target=\"_blank\"><img class=\"myapps\" alt=\"\
    [My Apps]\" src=\"/static/myapps.png\"></a>\n\nClick on your integration in the list of connected\
    \ integrations.\n\n<a href=\"/static/webhookapp.png\" target=\"_blank\"><img class=\"webhookapp\"\
    \ alt=\"[My Apps]\" src=\"/static/webhookapp.png\"></a>\n\nEnter the URL to receive webhook requests\
    \ in the **Webhook URL** field (1) and press the **Save** button (2).\nThe URL you entered must match\
    \ the whitelisted base URL you provided to us when your integration was set up.\nYour test account\
    \ should start receiving webhooks at that URL.\n\nIf no Webhook URL field is visible, the selected\
    \ application does not have webhooks enabled.\n\n<p style='color: red'>If the Webhook URL field is\
    \ disabled, your test user has not authorized webhooks yet.\nSee the <a href='/#authorizing-webhooks'><strong>Authorizing\
    \ Webhooks</strong></a> section for more information.</p>\n\n### How do I trigger a webhook?\n\nNavigate\
    \ to the Sign Up Forms screen <a href='https://www.aweber.com/users/web_forms' target='_blank'>here</a>.\n\
    If you aren’t logged in, you will need to provide your AWeber Customer Account credentials.\nClick\
    \ the **Publish** link for the desired sign up form.\n\n<a href=\"/static/publishform.png\" target=\"\
    _blank\"><img class=\"publishform\" alt=\"[My Apps]\" src=\"/static/publishform.png\"></a>\n\nWhen\
    \ the Publish screen appears, click on the **Use My Form as a Landing Page** section.\nCopy and paste\
    \ the URL provided into a new window. Complete the fields on the sign up form.\nThis will trigger\
    \ our `subscriber.added` webhook outlined further down in this document.\n\n***Alternatively:*** You\
    \ can add subscribers via our\n<a href='/#tag/Subscribers/paths/~1accounts~1{accountId}~1lists~1{listId}~1subscribers/post'>Add\
    \ Subscriber</a>\nendpoint in our API.\n\n## Verifying Webhook Payloads\n\n### Procedure\n\nWhen you\
    \ receive a request to your webhook URL, you should first verify that the request came from AWeber.\
    \  The\n**Verification Key** is the key of an HMAC-SHA256 hash of the request's `Date` header and\
    \ request body.\n\nThe message to hash is constructed by:\n`rstrip('date:' + date_header_value + '\\\
    n' + request_body)`\n\nWhere:\n- `rstrip` is a function that removes all space, tab, line feed, carriage\
    \ return, vertical tab, and form feed characters (0x20, 0x09, 0x0a, 0x0d, 0x0b, and 0x0c) from the\
    \ end of a string\n- `date_header_value` is the value of the `Date` request header\n- `request_body`\
    \ is the full HTTP request body\n\n### Example\n\nGiven this HTTP Request\n\n```\nPOST /my-callback\
    \ HTTP/1.1\nAWeber-Delivery-ID: 238D534C-2101-4440-98D7-7404938C3675\nAWeber-Signature: sha256=74856469e8a97c0939a8d398460e1ffc83e4e40a46e657c61e9d3723035df10a\n\
    Content-Length: 130\nContent-Type: application/vnd.aweber.webhook+json; version=1.0\nDate: Mon, 21\
    \ Oct 2019 19:05:20 GMT\n\n\n{\"account\": null\n,\"client_id\": \"fKcKvImyD2pQmRDWYSFx92rReytdL4Jh\"\
    \n,\"callback\": \"5AB10F8A-EC5A-40E8-AF0B-7DC8DF580E55\"\n,\"data\": []}\n```\n\nThe message to verify\
    \ would be:\n```\ndate:Mon, 21 Oct 2019 19:05:20 GMT\\n{\"account\": null\\n,\"client_id\": \"fKcKvImyD2pQmRDWYSFx92rReytdL4Jh\"\
    \\n,\"callback\":\"5AB10F8A-EC5A-40E8-AF0B-7DC8DF580E55\"\\n,\"data\": []}\n```\n\nGiven a base64\
    \ encoded verification key `bXktdmVyaWZpY2F0aW9uLWtleQ==` the expected signature can be calculated:\n\
    ```\nsha256hmac(key=b64decode('bXktdmVyaWZpY2F0aW9uLWtleQ=='), message='date:Mon, 21 Oct 2019 19:05:20\
    \ GMT\\n{\"account\": null\\n,\"client_id\": \"fKcKvImyD2pQmRDWYSFx92rReytdL4Jh\"\\n,\"callback\"\
    : \"5AB10F8A-EC5A-40E8-AF0B-7DC8DF580E55\"\\n,\"data\": []}')\n```\n\nThe result, `74856469e8a97c0939a8d398460e1ffc83e4e40a46e657c61e9d3723035df10a`,\
    \ should match the hex digest following `sha256=`\n from the `AWeber-Signature` header.\n\nOnce the\
    \ message has been verified, you should check that the `client_id` field matches the Client ID of\
    \ your integration.\n\n### Python Verification Script\n\nThe following Python script implements webhook\
    \ verification. It defines these variables:\n- `request_headers`: a dictionary mapping HTTP request\
    \ headers to their values\n- `request_body`: the full HTTP request body\n- `key_b64`: the base64 encoded\
    \ verification key\n\n```python\n#!/usr/bin/env python\nimport base64\nimport hmac\n\nrequest_headers\
    \ = {\n    'Date': 'Mon, 21 Oct 2019 19:05:20 GMT',\n    'AWeber-Signature': ('sha256=74856469e8a97c0939a8d398460e1ffc83e4e40a46e65'\n\
    \                         '7c61e9d3723035df10a'),\n}\n\nrequest_body = b\"\"\"\\\n{\"account\": null\n\
    ,\"client_id\": \"fKcKvImyD2pQmRDWYSFx92rReytdL4Jh\"\n,\"callback\": \"5AB10F8A-EC5A-40E8-AF0B-7DC8DF580E55\"\
    \n,\"data\": []}\"\"\"\n\nkey_b64 = 'bXktdmVyaWZpY2F0aW9uLWtleQ=='\n\n# The verification key is encoded\
    \ in base64\nkey = base64.b64decode(key_b64)\n\n# The AWeber-Signature header contains the hash type\
    \ and hash separated by '='\nalg, _, expected_hash = request_headers['AWeber-Signature'].partition('=')\n\
    if alg != 'sha256':\n    raise ValueError('Unexpected hash type: ' + alg)\n\nmessage = (b'date:' +\n\
    \           request_headers['Date'].encode('utf-8') +\n           b'\\n' +\n           request_body)\n\
    calculated_hash = hmac.HMAC(key, msg=message.rstrip(), digestmod='SHA256')\nif calculated_hash.hexdigest()\
    \ != expected_hash:\n    raise ValueError('Invalid signature')\n\nprint('Signature validated!')\n\
    ```\n\n## Returning a Response\n\nIf you successfully process the message, you should return a **200**\
    \ status code in your response. The response body will be ignored.\n\nIf you return a non-2XX level\
    \ status code due to a failure, we may retry the message or stop sending webhooks entirely.\n\n##\
    \ Webhook Reference\n\n### Headers\n\nAWeber webhook callback requests will include the following\
    \ HTTP headers:\n\n| <div style='width:180px'>Header</div> | Description       |\n|-----------------------------|-------------------|\n\
    | `AWeber-Delivery-ID`        | Unique identifier for this request. This is helpful to include if\
    \ you need support. |\n| `AWeber-Signature`          | Hash type and message digest separated by an\
    \ equals sign (=). The only defined hash type is `sha256` for HMAC-SHA256. See <a href='https://tools.ietf.org/html/rfc2104'\
    \ target='_blank'>RFC-2104</a> for more details. |\n| `Date`                      | Date the message\
    \ was generated. See <a href='https://tools.ietf.org/html/rfc7231#section-7.1.1.2' target='_blank'>RFC-7231§7.1.1.2</a>\
    \ and <a href='https://tools.ietf.org/html/rfc5322#section-3.3' target='_blank'>RFC-5322§3.3</a> for\
    \ more details. |\n\n### Body\n\n| <div style='width:100px'>Name</div> | Type             | Description\
    \               |\n|-------------|------------------|---------------------------|\n| `account`   |\
    \ string           | Uniquely identifies the account that this event was fired for. |\n| `client_id`\
    \ | string           | OAuth 2 client ID assigned to the application. |\n| `callback`  | string  \
    \         | Unique identifier for the callback. |\n| `data`      | array of objects | Each object\
    \ contains two members: `event` and `payload`. The event is the name of the event and the payload\
    \ is the data associated with the event. |\n\n### Events\n\nEvents that occur in short succession\
    \ will be batched together. Event batch sizes can range in size.\nBatches are multiple events that\
    \ are predetermined for a single callback url.\n\n#### subscriber.added\n\nTriggered when a subscriber\
    \ is added to a list regardless of the status of the subscriber. This event is fired for **both**\
    \ verified and unverified subscribers.\n\nThe payload of a `subscriber.added` event is a JSON object\
    \ with these members:\n\n| <div style='width:180px'>Name</div> | Type             | Description  \
    \             |\n|-------------------------------------|------------------|---------------------------|\n\
    | `account` | string | Uniquely identifies the AWeber account this is attached to. |\n| `ad_tracking`\
    \ | string | Optional customer-specified ad-tracking field that was included with the subscription\
    \ request. |\n| `custom_fields` | object | Mapping of current custom field values. Fields without\
    \ values will be omitted. |\n| `email` | string | Email address of the subscriber at the time of event\
    \ generation. |\n| `id` | string | Uniquely identifies this subscriber. |\n| `links` | object |  Links\
    \ to related entity URLs. These should be used to retrieve those entities from the API. <br /><br\
    \ /> It will contain the following members: <ul><li> `account`: The <a href='/#tag/Accounts/paths/~1accounts~1{accountId}/get'>account</a>\
    \ this subscriber is attached to. </li><li>`list`: This <a href='/#tag/Lists/paths/~1accounts~1{accountId}~1lists~1{listId}/get'>list</a>\
    \ the subscriber is part of.</li><li>`subscriber`: This <a href='/#tag/Subscribers/paths/~1accounts~1{accountId}~1lists~1{listId}~1subscribers~1{subscriberId}/get'>subscriber</a>.</li></ul>\
    \ |\n| `list` | string | Uniquely identifies the list that this subscriber is part of. |\n| `misc_notes`\
    \ | string | Optional notes that were included with the subscription request. |\n| `name` | string\
    \ | Display name of the subscriber. |\n| `signup_ip` | string | IPv4 or IPv6 address that the subscription\
    \ was created from. |\n| `signup_location` | object | Mapping of signup location fields to values\
    \ if the location was known at the time of signup. This field will be `null` otherwise. <br /> <br\
    \ />It will contain the following members: <ul><li>`city`: string</li><li>`country_code`: string</li><li>`country_name`:\
    \ string</li><li>`latitude`: number</li><li>`longitude`: number</li><li>`metro_code`: number</li><li>`postal_code`:\
    \ string</li><li>`region_code`: string</li><li>`region_name`: string</li></ul> Fields without values\
    \ are included with the value set to `null`. |\n| `status` | string | One of `subscribed`, `unconfirmed`,\
    \ `unsubscribed`, or `deleted`. |\n| `subscribed_at` | string | ISO-8601 date-time at which the subscriber\
    \ record was created. |\n| `subscription_method` | string | One of `api`, `email`, `import`, or `webform`.\
    \ |\n| `subscription_url` | string | URL that the subscriber was added with. |\n| `tags` | array of\
    \ strings | Possibly empty array of tags that the subscriber is marked with. |\n| `unsubscribe_method`\
    \ | string | One of `unsubscribe link`, `customer cp`, `undeliverable`, `api: unsubscribe`, or `api:\
    \ move`. |\n| `unsubscribed_at` | string | ISO-8601 date-time at which the subscriber was unsubscribed.\
    \ |\n| `verified_at` | string | ISO-8601 date-time at which the subscriber was verified. |\n\n#####\
    \ Example HTTP Request\n```\nPOST /example HTTP/1.1\nAWeber-Delivery-ID: 238D534C-2101-4440-98D7-7404938C3675\n\
    AWeber-Signature: sha256=99e0837dff15e0e27dc6729db56ac23860bd2d2da7ba07eb173f07628a7c7bad\nContent-Length:\
    \ 1646\nContent-Type: application/vnd.aweber.webhook+json; version=1.0\nDate: Mon, 21 Oct 2019 19:05:20\
    \ GMT\n\n{\n  \"account\": \"c6501188-693a-472d-b426-296833f7e0ac\",\n  \"client_id\": \"EmfELYyHkpYQMioIs7WidJf73csfev3b\"\
    ,\n  \"callback\": \"dd16587a-f7d1-4fdf-9f53-98f0353089a7\",\n  \"data\": [\n    {\n      \"event\"\
    : \"subscriber.added\",\n      \"payload\": {\n        \"account\": \"c6501188-693a-472d-b426-296833f7e0ac\"\
    ,\n        \"ad_tracking\": \"control panel\",\n        \"custom_fields\": {\n          \"apple\"\
    : \"fuji\",\n          \"pear\": null\n        },\n        \"email\": \"example@example.com\",\n \
    \       \"id\": \"7941c272-6189-4318-b07f-c108368df796\",\n        \"links\": {\n          \"account\"\
    : \"https://api.aweber.com/1.0/accounts/000000\",\n          \"list\": \"https://api.aweber.com/1.0/accounts/000000/lists/000000\"\
    ,\n          \"subscriber\": \"https://api.aweber.com/1.0/accounts/000000/lists/000000/subscribers/000000\"\
    \n        },\n        \"list\": \"6011a920-d7d1-4829-a62a-b1c9309e2465\",\n        \"misc_notes\"\
    : \"\",\n        \"name\": \"Webhooks Tester\",\n        \"signup_ip\": \"204.194.222.28\",\n    \
    \    \"signup_location\": {\n          \"city\": \"Chalfont\",\n          \"country_code\": \"US\"\
    ,\n          \"country_name\": \"United States\",\n          \"latitude\": 40.2964,\n          \"\
    longitude\": -75.2053,\n          \"metro_code\": \"504\",\n          \"postal_code\": \"18914\",\n\
    \          \"region_code\": \"PA\",\n          \"region_name\": \"Pennsylvania\"\n        },\n   \
    \     \"status\": \"unconfirmed\",\n        \"subscribed_at\": \"2019-10-16T19:05:20-05:00\",\n  \
    \      \"subscription_method\": \"webform\",\n        \"subscription_url\": \"https://www.aweber.com/users/leads/add\"\
    ,\n        \"tags\": [],\n        \"unsubscribe_method\": null,\n        \"unsubscribed_at\": null,\n\
    \        \"verified_at\": null\n      }\n    }\n  ]\n}\n```\n\n#### subscriber.subscribed\n\nTriggered\
    \ when a subscriber is subscribed to a list.  This event is fired for subscribers on both <a href='https://help.aweber.com/hc/en-us/articles/204030556-Confirmed-Opt-In-Definition-'\
    \ target='_blank'>COI</a> and <a href='https://help.aweber.com/hc/en-us/articles/360002687873-Things-to-consider-when-changing-from-confirmed-optin-in-to-single-opt-in-'\
    \ target='_blank'>SOI</a> lists.\n\nThe payload of a `subscriber.subscribed` event is a JSON object\
    \ with these members:\n\n| <div style='width:180px'>Name</div> | Type             | Description  \
    \             |\n|-------------------------------------|------------------|---------------------------|\n\
    | `account` | string | Uniquely identifies the AWeber account this is attached to. |\n| `ad_tracking`\
    \ | string | Optional customer-specified ad-tracking field that was included with the subscription\
