          \ \\\n  \"lists/#{list_id}/subscribers/#{subscriber_id}\"\n) do |req|\n  req.headers = headers\n\
          end\nputs response.status\n"
      responses:
        '200':
          description: The subscriber was deleted successfully
        '400':
          $ref: '#/components/responses/BadOAuth1LessTypes'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '410':
          $ref: '#/components/responses/BlockedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
