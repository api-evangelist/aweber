- name: FAQ
  description: '### **Do I need to be an AWeber customer to develop an application?**

    ------------

    To develop an API application, you will need to <a href=''https://labs.aweber.com'' target="_blank">

    open an AWeber Labs account</a> which is 100% free and entirely unrelated to AWeber customer accounts.


    If you are not an AWeber customer already, you may also want to

    <a href=''https://www.aweber.com/order.htm'' target="_blank">create an AWeber customer account</a>

    using a free 1 month trial. This account can be used to test the API application

    which you are developing.


    ### **How does AWeber''s API handle user authentication?**

    ------------

    The AWeber API uses OAuth to handle authenticating requests on behalf of AWeber users.  OAuth provides

    a standardized way for providing third party applications access to a user''s data without the need
    for that

    customer to give out their username and password. For more information on how authentication is implemented

    in the AWeber API, please read [our authentication guide][0].


    ### **What character encoding does the API use?**

    ------------

    The AWeber API uses <a href=''http://en.wikipedia.org/wiki/UTF-8'' target="_blank">UTF-8</a> character
    encoding.

    UTF-8 was chosen due to its widespread usage online and is supported by a majority of the programming

    languages in use today.


    - <a href=''http://kunststube.net/encoding/'' target="_blank">What every programmer needs to know
    about character encoding</a>


    When passing data to the AWeber API, it''s up to the app developer to ensure that the data is sent
    to us using

    the proper character encoding.  The API will return a <a href=''https://api.aweber.com#badrequest''
    target="_blank">

    Bad Request</a> with ''Invalid Character Encoding'' if the data sent to the API is not UTF-8 encoded.


    ### **How do I update customer account information / add subscribers?**

    ------------

    You can add a subscriber to a list by invoking the [POST Subscriber][1] endpoint.

    Please refer to our <a class="php" href="https://github.com/aweber/public-api-examples/tree/master/php/manage-subscriber"
    target="_blank">php</a> and <a class="python" href="https://github.com/aweber/public-api-examples/tree/master/python/manage-subscriber"
    target="_blank">python</a> code samples for examples of adding Subscribers.</p>


    Customer account information cannot currently be edited via the API.

    Please refer to our [reference documentation][2] or [changelog][3] for more details.


    ### **What formats of data are returned by the AWeber API?**

    ------------

    All requests in the AWeber API, including error messages, are returned as JSON formatted strings.  JSON
    was chosen

    due to its ease of readability and because it is well supported in a large number of languages.


    ### **How many requests can my application make in a given amount of time?**

    ------------

    AWeber API requests are limited to 120 requests per minute, per customer account.


    [0]: #tag/Getting-Started "gettingStarted"

    [1]: #tag/Subscribers%2Fpaths%2F~1accounts~1%7BaccountId%7D~1lists~1%7BlistId%7D~1subscribers%2Fpost
    "postSubscriber"

    [2]: #tag/Accounts "accounts"

    [3]: #tag/API-Changelog "changelog"

    '
- name: Troubleshooting
  description: "# Authentication Errors\nWhen authenticating an application, there are a few errors which\
    \ a user may encounter. This section will provide you with\ninput into some of the authentication\
    \ errors and how to resolve them.\n\n<h2 id='common-issues'><strong>Common Issues<hr></strong></h2>\n\
    \n### Invalid redirect URI\nIf this error is encountered, it is due to a mismatch between the `redirect_uri`\
    \ being submitted and the `OAuth Redirect URL` specified when creating\nthe application in your <a\
    \ href=\"https://labs.aweber.com\" target=\"_blank\">AWeber Developer</a> account.\n\n<a href=\"/static/redirect-uri.png?v=20200515\"\
    \ target=\"_blank\"><img class=\"redirect-uri\" alt=\"[OAuth2 Redirect]\" src=\"/static/redirect-uri.png?v=20200515\"\
    ></a>\n\n#### Troubleshooting Checklist\n- Ensure the submitted `redirect_uri` ***exactly*** matches\
    \ the `OAuth Redirect URL` specified for your application.\n    - Make sure there are no characters\
    \ added/missing.\n\n<h2 id='public-requires-pkce'><strong>Public Applications<hr></strong></h2>\n\n\
    ### PKCE Errors\nThese errors are raised when you try to authorize a public application, but do not\
    \ include a <code>code_challenge</code> in your original request.\n- Public Client MUST Use PKCE\n\
    - code_challenge is required for public client\n\n#### Troubleshooting Checklist\n- See [here](#section/Public-or-confidential)\
    \ for steps on how to authenticate a public application.\n\n<h2 id='confidential-with-pkce'><strong>Confidential\
    \ Applications</strong><hr></h2>\n\n### PKCE Errors\nThese errors are raised when you try to authorize\
    \ a confidential application and include a <code>code_verifier</code>, <code>challenge</code>,\nor\
    \ <code>challenge_method</code> in your request\n- Confidential Client MUST NOT Use PKCE\n- code_challenge\
    \ and code_challenge_method are disallowed for confidential clients\n\n#### Troubleshooting Checklist\n\
    - See [here](#tag/Authentication-Overview) for steps on how to authenticate a confidential application.\n\
    \n# API Errors\nIf an API call results in an error, the API response will return details about the\
    \ error using JSON. Most errors encountered\nwith the API can be easily handled and corrected in your\
    \ application. To provide a better user experience, you should design\nyour API applications to expect\
    \ errors and handle them appropriately.\nWhen an error is returned:\n- The appropriate HTTP status\
    \ will be set in the response headers.\n- Content-Type will be set to application/json.\n- The body\
    \ will consist of a JSON formatted dictionary with a single key called \"error\" containing the status,\
    \ error type,\nmessage, and documentation URL.\n\nHere is a sample API error response:\n```json\n\
    {\"error\":\n  {\"status\": 401,\n   \"message\": \"Consumer key is invalid.\",\n   \"type\": \"UnauthorizedError\"\
    ,\n   \"documentation_url\": \"https://api.aweber.com\"}}\n```\n\n<h2 id='badrequest'><strong>400\
    \ BadRequestError<hr></strong></h2>\nThis error is raised when you make a properly authenticated request\
    \ to a valid resource with incorrect parameters.\nIf you receive 400 BAD REQUEST errors, refer to\
    \ the actual error message as well as the appropriate documentation for the\nmethod you are calling.\n\
    <br>\n\n#### Examples\n- Attempting to modify a read-only field.\n- Invoking the find() method on\
    \ a subscriber entry without supplying an email address\n- Invoking the move() method on a subscriber\
    \ entry without supplying a list\n- Creating or modifying resources using invalid character encodings.\
    \ (See [FAQ](#tag/FAQ))\n- Creating or modifying a resource while missing required parameters\n  \
    \  - Note: For [Creating Broadcasts](#tag/Broadcasts/paths/~1accounts~1{accountId}~1lists~1{listId}~1broadcasts/post),\
    \ either `body_text` or `body_html` must always be included.\n- Passing through a private or reserved\
    \ IP address when adding a subscriber (\"Invalid Subscriber IP address. The address is part of a reserved\
    \ block.\")\n\n#### Troubleshooting Checklist\n- Refer to the error message for a summary of what\
    \ is wrong.\n- Refer to the API reference documentation for the method you're calling to find out\
    \ what it requires.\n\n\n<h2 id='unauthorized'><strong>401 UnauthorizedError<hr></strong></h2>\nThis\
    \ class of errors represents authentication errors. In order to troubleshoot authentication errors,\
    \ a basic understanding\nof the OAuth 2.0 Authentication Protocol is required. Please refer to the\
    \ following documentation for more information on\nhow we handle authentication with the AWeber API\
    \ as well as specific examples of how to handle each kind of authentication error.\n\n[AWeber API\
    \ Authentication](#tag/Getting-Started) <br>\n<a href=\"https://tools.ietf.org/html/rfc6749\" target=\"\
    _blank\">RFC5849 OAuth 2.0 Specification</a>\n\n### **Invalid Token**\nThis error is raised when your\
    \ access token key is expired or invalid. The most common causes for this error is that the AWeber\
    \ Customer\ndisconnected your application from their account, you're access token has expired, or\
    \ you have a typographical error in the access token key.\n\n#### Troubleshooting Checklist\n- Obtain\
    \ a new access token key.\n\n### **Invalid Account**\nThis error is raised when the AWeber Customer\
    \ account is no longer active. The most common causes for this error are that the\nAWeber Customer\
    \ cancelled their account or you are using an invalid account id.\n\n#### Troubleshooting Checklist\n\
    - Contact support to reactivate the AWeber Customer account.\n\n### **Invalid Request**\nThis error\
    \ is raised when your application attempts to communicate to the AWeber API without using the OAuth\
    \ 2.0 protocol. You must\nfully implement the OAuth 2.0 protocol to access the AWeber API.\n\n####\
    \ Troubleshooting Checklist\n- If you are new to OAuth 2.0, refer to our [API Authentication Guide](#tag/Getting-Started).\n\
    \n\n<h2 id='forbidden'><strong>403 ForbiddenError<hr></strong></h2>\nThis class of errors is used\
    \ when the API understands your request but has refused to grant access to the requested resource.\n\
    \n### **Account Temporarily Suspended**\nThis error is raised when the AWeber Customer account is\
    \ temporarily suspended. The most common causes for this error are that the AWeber\nCustomer has a\
    \ billing issue or you are using an invalid account id.\n\n#### Troubleshooting Checklist\n- Contact\
    \ support to reactivate the AWeber Customer account.\n\n### **Adding subscribers is not available\
    \ while the account is on hold.**\nThis error is raised when the AWeber Customer account is on hold.\
    \ The customer has decided to switch their account to the hold package which\ndoes not allow subscribers\
    \ to be added.\n\n#### Troubleshooting Checklist\n- Switch the AWeber Customer account off of the\
    \ hold package.\n\n### **Application not authorized to manage email.**\nThis error is raised when\
    \ you make a request to create or schedule a Broadcast, but your application has not been authorized\
    \ by the AWeber\nCustomer to manage email.\n\n#### Troubleshooting Checklist\n- Ensure that your application\
    \ has specified that it requires the <a href=\"https://help.aweber.com/hc/en-us/articles/360002999053\"\
    \ target=\"_blank\">\nManage All Email Communications</a> permission.\n- Ensure that the AWeber Customer\
    \ has authorized your application after it was modified to require the\n<a href=\"https://help.aweber.com/hc/en-us/articles/360002999053\"\
    \ target=\"_blank\">Manage All Email Communications</a> permission. The AWeber\nCustomer may need\
    \ to disable and re-enable your application to grant this authorization.\n\n### **Rate Limit Error.**\n\
    This error is raised when the number of API requests made by your application exceed its predefined\
    \ limit. These rate limits are outlined in our\n<a href=\"https://help.aweber.com/hc/en-us/articles/360002917994\"\
    \ target=\"_blank\">knowledge base</a>.\n\n#### Troubleshooting Checklist\n- Reduce the frequency\
    \ that you make API requests.\n- Utilize a local cache in your application to prevent making unnecessary\
    \ API requests.\n- See our <a href=\"https://help.aweber.com/hc/en-us/articles/360002917994\" target=\"\
    _blank\">knowledge base</a> documentation on how to handle rate limits.\n\n### **Subscriber Complaints\
    \ Error.**\nThis error is raised when the number of complaints reported by subscribers is too high.\n\
    Complaints generally occur when subscribers receive email they did not sign up for or do not want.\n\
    Continued complaints reported by subscribers can lead to the suspension of the AWeber account.\n\n\
    #### Troubleshooting Checklist\n- Review and implement these <a href=\"https://help.aweber.com/entries/21748721-How-Do-I-Lower-My-Complaint-Rate-\"\
    \ target=\"_blank\">\nbest practices</a> to lower subscriber complaints.\n- Wait for those complaints\
    \ to lessen.\n\n### **Resource temporarily unavailable**\nThis error is raised when the POST or PUT\
    \ request length exceeds 1 million bytes of data when creating a broadcast message.\n\n#### Troubleshooting\
    \ Checklist\n- Send a smaller POST/PUT payload.\n\n### **The email address provided cannot be accepted\
    \ at this time**\nThis error is raised when the subscriber email address is not currently acceptable.\n\
    \n#### Troubleshooting Checklist\n- Try again using an exponential backoff\n\n### **This account is\
    \ not accepting requests at this time**\n#### Troubleshooting Checklist\n- Try again using an exponential\
    \ backoff\n\n### **Your request cannot be processed at this time**\n#### Troubleshooting Checklist\n\
    - Try again using an exponential backoff\n\n### **Subscriber limit reached.**\n- You've reached the\
    \ subscriber limit for your current plan. Upgrade to continue adding subscribers.\n\n\n<h2 id='notfound'><strong>404\
    \ NotFoundError<hr></strong></h2>\nThis error is raised when the requested resource does not exist.\n\
    \n#### Troubleshooting Checklist\n- Check the URL of the resource you are requesting.\n- Refer to\
    \ the [API Reference Documentation](#tag/Accounts) for more information.\n\n\n<h2 id='methodnotallowed'><strong>405\
    \ MethodNotAllowedError<hr></strong></h2>\nThis error is raised when a properly authenticated request\
    \ is made to a valid resource, but the HTTP method you used is not allowed.\n\n#### Examples\n- Attempting\
    \ to modify a read-only resource using the PUT or PATCH method.\n- Invoking the move() method on a\
    \ subscriber entry that has a status of 'unconfirmed'.\n\n#### Troubleshooting Checklist\n- Check\
    \ the URL of the resource you are requesting.\n- Make sure the resource supports the HTTP method you\
    \ are using.\n- Check the response from the error message for further details.\n- Refer to the [API\
    \ Reference Documentation](#tag/Accounts) for more information.\n\n\n<h2 id='conflict'><strong>409\
    \ Conflict</strong></h2><hr>\nThis error is raised when the request could not be completed due to\
    \ a conflict with the current state of the resource.\n\n#### Examples\n- Attempting to schedule a\
    \ Broadcast that has already been sent.\n\n\n<h2 id='blocked'><strong>410 BlockedError<hr></strong></h2>\n\
    This error is raised when the request is blocked.\n\n#### Troubleshooting Checklist\nThis request\
    \ has been blocked. If you feel this is a mistake, please contact api@aweber.com\nand include your\
    \ IP Address, the name of your integration, the API endpoint URL you were\nattempting to reach, and\
    \ any other information you feel would be helpful\n\n\n<h2 id='invalidcontent'><strong>415 InvalidContentType<hr></strong></h2>\n\
    This error is raised when the request is in a format that is not supported by the resource for the\
    \ method.\n\n#### Examples\n- Making a POST request with a Content-Type other than application/x-www-form-urlencode.\n\
    \n\n<h2 id='internalerror'><strong>500 InternalServerError<hr></h2></strong>\n\nThis error is raised\
    \ when the API experiences an internal error.\n\n#### Troubleshooting Checklist\n- Try your request\
    \ again.\n- Contact support if the problem persists.\n\n\n<h2 id='serviceunavailable'><strong>503\
    \ ServiceUnavailableError<hr></strong></h2>\n\nThis error is raised when the API is down for maintenance.\n\
    \n#### Troubleshooting Checklist\n- Try your request again.\n- Contact support if the problem persists.\n\
    \n#### Troubleshooting Checklist\n- Use a version of the Python Client Library >= 1.2.1\n- Contact\
    \ support if the problem persists.\n\n\n# Non-Error Responses\n\n<h2 id='nocontent'><strong>204 NoContent<hr></strong></h2>\n\
    \nA 204 No Content status is returned when an API resource was successfully updated and there is no\
    \ content to return.\n\n\n<h2 id='contentmodified'><strong>209 ContentModified<hr></strong></h2>\n\
    \nA 209 Content Modified status is returned along with a JSON representation when an API resource\
    \ was successfully updated with an HTTP PATCH request.\n"
