        type: integer
        format: int32
    campaignType:
      name: campaignType
      in: path
      description: The campaign type (b - broadcast, f - followup)
      required: true
      schema:
        type: string
        enum:
        - b
        - f
    campaignId:
      name: campaignId
      required: true
      in: path
      description: The campaign ID
      schema:
        type: integer
        format: int32
    statsId:
      name: statsId
      required: true
      in: path
      description: '<br>


        >The statistic''s ID.

        >

        >The datatype of the ID may be different for each Stat.

        >

        >Below is a list of the statistic IDs that can be passed in.

        >

        >__Aggregate Statistics__

        >

        >| Stat ID | Description |

        >|---------|-------------|

        >| total_clicks | Total number of times a subscriber clicked any link appearing in your campaign
        except the unsubscribe link (includes multiple clicks of the same link) |

        >| unique_clicks | Total number of subscribers who clicked any link in your campaign |

        >| total_opens | Total number of times your campaign was opened by any subscriber your campaign
        was sent to (including multiple opens by the same subscriber) |

        >| unique_opens | Total number of subscribers who opened your campaign |

        >| total_sales | Total number of sales made by subscribers who received your campaign |

        >| total_sales_dollars | Total monetary value of sales made by subscribers who received your campaign
        |

        >| total_unsubscribed | Total number of subscribers who unsubscribed by clicking the unsubscribe
        link in your campaign |

        >

        >__Time Related Statistics__

        >

        >| Stat ID | Description |

        >|---------|-------------|

        >| hourly_clicks | Hourly breakdown of unique and total clicks for the first 24 hours after a
        campaign was sent |

        >| hourly_opens | Hourly breakdown of unique and total opens for the first 24 hours after a campaign
        was sent |

        >| hourly_sales | Hourly breakdown of sales for the first 24 hours after a campaign was sent |

        >| hourly_unsubscribed | Hourly breakdown of subscribers who unsubscribed by clicking the unsubscribed
        link for the first 24 hours after a campaign was sent |

        >| hourly_webhits | Hourly breakdown of webhits to your website from subscribers sent this message
        for the first 24 hours after a campaign was sent |

        >| daily_clicks | Daily breakdown of unique and total clicks for the first 14 days after a campaign
        was sent |

        >| daily_opens | Daily breakdown of unique and total opens for the first 14 days after a campaign
        was sent |

        >| daily_sales | Daily breakdown of sales for the first 14 days after a campaign was sent |

        >| daily_unsubscribed | Daily breakdown of subscribers who unsuscribed by clicking the unsubscribed
        link for the first 14 days after a campaign was sent |

        >| daily_webhits | Daily breakdown of webhits to your website from subscribers sent this message
        for the first 14 days after a campaign was sent |

        >

        >__Top 10 URL Statistics__

        >

        >| Stat ID | Description |

        >|---------|-------------|

        >| clicks_by_link | Top 10 links that were clicked (ranked by total_clicked) |

        >| webhits_by_link | Top 10 webhits by click (ranked by total clicks) |

        >

        >__Top 10 Subscriber Statistics__

        >(Requires access to subscriber data)

        >

        >| Stat ID | Description |

        >|---------|-------------|

        >| opens_by_subscriber | Top 10 subscribers that opened your message (ranked by total opens) |

        >| sales_by_subscriber | Top 10 subscribers that made a sale from your message (ranked by total
        sales dollars) |

        '
      schema:
        type: string
        enum:
        - total_clicks
        - unique_clicks
        - total_opens
        - unique_opens
        - total_sales
        - total_sales_dollars
        - total_unsubscribed
        - hourly_opens
        - hourly_clicks
        - hourly_webhits
        - hourly_sales
        - hourly_unsubscribed
        - daily_opens
        - daily_clicks
        - daily_webhits
        - daily_sales
        - daily_unsubscribed
        - clicks_by_link
        - webhits_by_link
        - opens_by_subscriber
        - sales_by_subscriber
    segmentId:
      name: segmentId
      in: path
      description: The segment ID
      required: true
      schema:
        type: integer
        format: int32
    oauth_consumer_key:
      name: oauth_consumer_key
      in: body
      required: true
      description: The consumer key assigned to your application, available on the <a href="https://labs.aweber.com/apps"
        target="_blank">My Apps Page</a>
      type: string
      example: XXXXXXXXXXXXXX
    oauth_callback:
      name: oauth_callback
      in: body
      required: false
      description: 'A url that will be sent the verifier token when authorizing the request token in a
        future step.

        If you don''t have a callback, use `oob` as the value, this will indicate that the callback is
        ''out of band''

        and will display an html page after authorization, containing the verifier token.

        '
      type: string
      example: http://localhost/demo.php
    oauth_nonce:
      name: oauth_nonce
      in: body
      required: true
      description: A unique, randomly generated string. Each request should have a unique nonce.
      type: string
      example: 510a6d6f0e4fb70b72096ce48cb22af8
    oauth_signature:
      name: oauth_signature
      in: body
      required: true
      description: 'This is an HMAC-SHA1 hash of the entire request, including the application''s secret,

        and the customer''s oauth_token_secret. Generating the signature is a complex process,

        and we highly recommend using an OAuth library that will handle this for you.

        '
      type: string
      example: uvNa27v1uyVES37VfsX2Tj1OUYU=
    oauth_signature_method:
      name: oauth_signature_method
      in: body
      required: true
      description: The hashing algorithm that was used to generate the signature. AWeber only supports
        the HMAC-SHA1 hash, so that's what this parameter should always be.
      type: string
      example: HMAC-SHA1
    oauth_timestamp:
      name: oauth_timestamp
      in: body
      required: true
      description: Timestamp for the request. This is in the format of a Unix timestamp, or seconds since
        January 1st, 1970.
      type: string
      example: 1285168264
    oauth_token:
      name: oauth_token
      in: body
      required: true
      description: 'This is the token that represents the user of the application. This will be either
        the request token,

        when in the process of gaining an access token, or the access token when making requests to the
        AWeber API.

        The oauth_token parameter will be blank when you are getting a request token for a new user.

        '
      type: string
      example: null
    oauth_version:
      name: oauth_version
      in: body
      required: true
      description: This identifies which version of the OAuth protocol you are using, and should always
        be 1.0 when working with the AWeber API.
      type: string
      example: 1.0
    broadcastId:
      name: broadcastId
      in: path
      description: The broadcast ID
      required: true
      schema:
        type: integer
        format: int32
    before:
      name: before
      in: query
      description: The pagination key when paging in reverse. Cannot be combined with `after`.
      schema:
        type: string
    after:
      name: after
      in: query
      description: The pagination key when paging forward. Cannot be combined with `before`.
      schema:
        type: string
    pageSize:
      name: page_size
      in: query
      description: The pagination total entries to retrieve
      schema:
        type: integer
        maximum: 100
        minimum: 1
        default: 100
    customFieldId:
      name: customFieldId
      in: path
      description: The custom field ID
      required: true
      schema:
        type: integer
        format: int32
    landingPageId:
      name: landingPageId
      in: path
      description: The landing page ID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The server cannot or will not process the request due to a client error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: 'An error object.

                  The following error may be received:


                  | Error Type        | Explanation |

                  |-------------------|-------------|

                  | BadRequestError   | The request is malformed.  This can be caused by missing authorization
                  credentials |

                  '
                type: object
                properties:
                  documentation_url:
                    description: A link to the documentation that describes the error
                    type: string
                    example: https://api.aweber.com#badrequest
                  message:
                    description: A human friendly description of the error
                    type: string
                    example: Missing required argument(s)
                  status:
                    description: The HTTP status code
                    type: integer
                    enum:
                    - 400
                  type:
                    description: The API error type
                    type: string
                    enum:
                    - BadRequestError
    UnauthorizedError:
      description: The request could not be completed due to an authentication error
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/schemas/Endpoint Error'
            - $ref: '#/schemas/Auth Error'
    ForbiddenError:
      description: The request could not be completed due to a rate limit error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
