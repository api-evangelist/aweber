    AddSubscriberRequestBody:
      type: object
      required:
      - email
      properties:
        ad_tracking:
          description: The customer ad tracking field
          type: string
          minLength: 1
          maxLength: 20
          example: ebook
        custom_fields:
          description: The custom fields specified on the subscriber.  Note that the custom fields are
            required to already exist for the list. See [Custom Fields](#tag/Custom-Fields) for details.
          type: object
          additionalProperties:
            type: string
            minLength: 1
          example:
            apple: fuji
            pear: bosc
        email:
          description: The subscriber's email address
          type: string
          minLength: 1
          maxLength: 50
          format: email
        ip_address:
          description: 'The subscriber''s IP address. This field is used to determine the following Geo
            Location fields: area_code, city, country, dma_code, latitude, longitude, postal_code, and
            region. IP address can only be specified when Subscribers are initially created. Internal,
            private, or reserved IP addresses are not acceptable.'
          type: string
          minLength: 1
          maxLength: 60
          format: ipv4
        last_followup_message_number_sent:
          description: The sequence number of the last followup message sent to the subscriber.  This
            field determines the next followup message to be sent to the Subscriber.  When set to 0 (default),
            the Subscriber should receive the 1st (autoresponse) Followup message.  Set the value of this
            field to 1001 if you do not want any Followups to be sent to this Subscriber.
          type: integer
          minimum: 0
          maximum: 1001
        misc_notes:
          description: Miscellaneous notes
          type: string
          minLength: 1
          maxLength: 60
        name:
          description: The subscriber's name
          type: string
          minLength: 1
          maxLength: 60
          example: John Doe
        strict_custom_fields:
          description: If this parameter is present and set to `true`, then custom field names are matched
            case sensitively.  Enabling this option also causes the operation to fail if a custom field
            is included that is not defined for the list.
          type: string
          enum:
          - 'true'
          - 'false'
        update_existing:
          description: 'If this parameter is present and set to `true`, then if a subscriber is already
            present on the list, the subscriber will be updated. <br><br> **Note:** <br>

            - Only the fields defined in the <a href=''#tag/Subscribers/paths/~1accounts~1{accountId}~1lists~1{listId}~1subscribers~1{subscriberId}/patch''>patch</a>
            endpoint will be updated.

            - Any tags in the request will be **appended** to the existing Subscriber.'
          type: string
          enum:
          - 'true'
          - 'false'
        tags:
          description: A list of tags added to the subscriber.  This field is used to apply a list of
            tags to a Subscriber. With Campaigns, you can trigger a series of messages based on what Tags
            have been applied to your subscribers.
          type: array
          items:
            type: string
          example:
          - slow
          - fast
          - lightspeed
    Subscriber:
      title: Subscriber
      type: object
      properties:
        ad_tracking:
          description: The customer ad tracking field
          type: string
          minLength: 1
          maxLength: 20
          example: ebook
        area_code:
          description: The subscriber's area code
          type: integer
          minimum: 0
          maximum: 999
          example: 555
        city:
          description: The subscriber's address city
          type: string
          minLength: 1
          maxLength: 100
          example: Chalfont
        country:
          description: The subscriber's address country
          type: string
          minLength: 1
          maxLength: 100
          example: United States
        custom_fields:
          description: The custom fields specified on the subscriber
          type: object
          additionalProperties:
            type: string
            minimum: 1
          example:
            apple: fuji
            pear: bosc
        dma_code:
          description: The subscriber's designated market area code (USA and canada only)
          type: integer
          maximum: 881
          minimum: 0
          example: 504
        email:
          description: The subscriber's email address.
          type: string
          minLength: 1
          maxLength: 50
          format: email
        id:
          description: The lead ID
          type: integer
          minimum: 0
          example: 789
        ip_address:
          description: The subscriber's IP address.
          type: string
          format: ipv4
          minLength: 1
          maxLength: 60
          example: 204.194.222.28
        is_verified:
          description: A value indication if the subscriber's email address confirmed
          type: boolean
        last_followup_message_number_sent:
          description: The sequence number of the last followup message sent to the subscriber.  If this
            value is set to 1001, then the subscriber will not receive followup messages.
          type: integer
          minimum: 0
          maximum: 1001
        last_followup_sent_at:
          description: The last followup message sent to the subscriber
          type: string
          format: date-time
          example: '2015-12-17T14:06:26.861089-05:00'
        last_followup_sent_link:
          description: A link to the [Last Follow Up Message](#tag/Campaigns/paths/~1accounts~1{accountId}~1lists~1{listId}~1campaigns~1{campaignType}{campaignId}/get)
            the subscriber was sent
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns/f12345678
        latitude:
          description: The subscriber's geographical latitude
          type: number
          format: double
          minimum: -90.0
          maximum: 90.0
          example: 37.751
        longitude:
          description: The subscriber's geographical longitude
          type: number
          format: double
          minimum: -180.0
          maximum: 180.0
          example: -97.822
        misc_notes:
          description: Miscellaneous notes.
          type: string
          maxLength: 60
          example: ebook
        name:
          description: The subscriber's name.
          type: string
          minLength: 1
          maxLength: 60
          example: John Doe
        postal_code:
          description: The subscriber's address postal code
          type: string
          minLength: 1
          maxLength: 100
          example: 99999-9999
        region:
          description: The subscriber's address stage or region abbreviation
          type: string
          minLength: 1
          maxLength: 100
          example: PA
        resource_type_link:
          description: A link that identifies the type of resource that this collection represents
          type: string
          format: uri
          enum:
          - https://api.aweber.com/1.0/#subscriber
        self_link:
          description: The link to this resource
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/subscribers/789
        status:
          description: The subscriber's status
          type: string
          enum:
          - subscribed
          - unsubscribed
          - unconfirmed
        subscribed_at:
          description: The timestamp for when the subscriber subscribed
          type: string
          format: date-time
          example: '2015-10-13T16:19:20-04:00'
        subscription_method:
          description: 'The method by which the subscriber was subscribed.


            | Method    | Description                              |

            | ------    | -----------                              |

            | api       | subscribed via an API integration        |

            | email     | subscriber emailed to list to opt-in     |

            | import    | subscriber was imported by the customer  |

            | webform   | subscriber subscribed via a web form     |

            '
          type: string
          enum:
          - api
          - email
          - import
          - webform
        subscription_url:
          description: The webform url from which the subscriber subscribed from
          type: string
          format: uri
          maximum: 100
          example: https://forms.aweber.com/form/16/123456789.htm
        tags:
          description: A list of tags added to the subscriber
          type: array
          items:
            type: string
            minLength: 1
          example:
          - slow
          - fast
          - lightspeed
        unsubscribe_method:
          description: The method that describes how the subscriber unsubscribed
          type: string
          enum:
