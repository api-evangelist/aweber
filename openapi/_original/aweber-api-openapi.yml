    \ entry endpoint response.\n\n### **Version 1.1.0**\n------------\n#### Release Date: June 16, 2021\n\
    - Replace usage of the `subscriber.read-extended` scope with `subscriber.read`.  If you were requesting\
    \ `subscriber.read-extended` then you should\n  change your application to request the `subscriber.read`\
