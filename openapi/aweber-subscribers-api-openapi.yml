components:
  parameters:
    accountId:
      name: accountId
      in: path
      description: The account ID
      required: true
      schema:
        type: integer
        format: int32
    findSubAdTracking:
      name: ad_tracking
      in: query
      description: The customer ad tracking field
      schema:
        type: string
        minLength: 1
        maxLength: 20
        example: ebook
    findSubAreaCode:
      name: area_code
      in: query
      description: The subscriber's area code
      schema:
        type: integer
        format: int32
        maximum: 999
        minimum: 0
        example: 555
    findSubCity:
      name: city
      in: query
      description: The subscriber's city
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: Chalfont
    findSubCountry:
      name: country
      in: query
      description: The subscriber's country
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: United States
    findSubCustomFields:
      name: custom_fields
      in: query
      description: The JSON encoded custom field key value pairs
      schema:
        type: string
        example: '{"apple": "fuji", "pear": "bosc"}'
    findSubDmaCode:
      name: dma_code
      in: query
      description: The subscriber's designated market area code (usa and canada only)
      schema:
        type: integer
        format: int32
        maximum: 881
        example: 504
    findSubEmail:
      name: email
      in: query
      description: The subscriber's email address
      schema:
        type: string
        minLength: 1
        maxLength: 50
        format: email
    findSubLastMessage:
      name: last_followup_message_number_sent
      in: query
      description: The sequence number of the last followup message sent to the subscriber
      schema:
        type: integer
        format: int32
        maximum: 1001
    findSubLastMessageSentAt:
      name: last_followup_message_sent_at
      in: query
      description: The day when the last followup message was sent to the subscriber
      schema:
        type: string
        format: date
        minLength: 1
        maxLength: 10
        example: '2017-11-28'
    findSubLatitude:
      name: latitude
      in: query
      description: The subscriber's geographical latitude
      schema:
        type: number
        format: double
        minimum: -90.0
        maximum: 90.0
        example: 37.751
    findSubLongitude:
      name: longitude
      in: query
      description: The subscriber's geographical longitude
      schema:
        type: number
        format: double
        minimum: -180.0
        maximum: 180.0
        example: -97.822
    findSubMiscNotes:
      name: misc_notes
      in: query
      description: Miscellaneous notes
      schema:
        type: string
        maxLength: 60
        example: ebook
    findSubName:
      name: name
      in: query
      description: The subscriber's name
      schema:
        type: string
        minLength: 1
        maxLength: 60
        example: John Doe
    findSubNotTag:
      name: tags_not_in
      in: query
      description: A string containing a JSON-formatted array of tags. Checks that all tags are not matched
        to a subscriber.
      schema:
        type: string
        example: '["tag1", "tag2"]'
    findSubPostalCode:
      name: postal_code
      in: query
      description: The subscriber's postal or zip code
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: 99999-9999
    findSubRegion:
      name: region
      in: query
      description: The subscriber's state or region abbreviation
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: PA
    findSubStatus:
      name: status
      in: query
      description: The subscriber's status
      schema:
        type: string
        enum:
        - subscribed
        - unsubscribed
        - unconfirmed
    findSubSubscribedAfter:
      name: subscribed_after
      in: query
      description: The day on or after the subscriber subscribed
      schema:
        type: string
        format: date
        example: '2017-07-16'
    findSubSubscribedAt:
      name: subscribed_at
      in: query
      description: The day in which the subscriber subscribed
      schema:
        type: string
        format: date
        example: '2017-07-16'
    findSubSubscribedBefore:
      name: subscribed_before
      in: query
      description: The day on or before the subscriber subscribed
      schema:
        type: string
        format: date
        example: '2017-07-16'
    findSubSubscriptionMethod:
      name: subscription_method
      in: query
      description: How the subscriber was subscribed
      schema:
        type: string
        enum:
        - api
        - email
        - import
        - webform
    findSubTags:
      name: tags
      in: query
      description: A string containing a JSON-formatted array of tags. All tags must match for the subscriber
        to match.
      schema:
        type: string
        example: '["tag1", "tag2"]'
    findSubUnsubscribeMethod:
      name: unsubscribe_method
      in: query
      description: How the subscriber unsubscribed
      schema:
        type: string
        enum:
        - unsubscribe link
        - customer cp
        - undeliverable
        - 'api: unsubscribe'
        - 'api: move'
    findSubUnsubscribedAfter:
      name: unsubscribed_after
      in: query
      description: The day on or after the subscriber unsubscribed
      schema:
        type: string
        format: date
        example: '2017-10-13'
    findSubUnsubscribedAt:
      name: unsubscribed_at
      in: query
      description: The day in which the subscriber unsubscribed
      schema:
        type: string
        format: date
        example: '2017-10-13'
    findSubUnsubscribedBefore:
      name: unsubscribed_before
      in: query
      description: The day on or before the subscriber unsubscribed
      schema:
        type: string
        format: date
        example: '2017-10-13'
    findSubVerifiedAt:
      name: verified_at
      in: query
      description: The day in which the subscriber confirmed their email address
      schema:
        type: string
        format: date
        example: '2017-07-18'
    listId:
      name: listId
      in: path
      description: The list ID
      required: true
      schema:
        type: integer
        format: int32
    sortKey:
      name: sort_key
      in: query
      description: The collection will be sorted by the field key specified. If no key is spcified the
        search will default to the order in which the subscribers were added to the list.
      schema:
        type: string
        enum:
        - subscribed_at
        - unsubscribed_at
    sortOrder:
      name: sort_order
      in: query
      description: The collection will be sorted by the order in which the subscribers were added to the
        list. To specify the order, use the value `asc` for ascending or `desc` for descending.
      schema:
        type: string
        default: asc
        enum:
        - asc
        - desc
    sortOrderList:
      name: sort_order
      in: query
      description: The collection will be sorted in the order specified by the key entered for `sort_key`.
        To specify the order, use the value `asc` for ascending or `desc` for descending.
      schema:
        type: string
        default: asc
        enum:
        - asc
        - desc
    subCollectionEmail:
      name: subscriber_email
      in: query
      description: The subscriber's email address
      required: true
      schema:
