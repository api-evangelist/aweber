    UpdateSubscriberRequestBody:
      type: object
      properties:
        ad_tracking:
          description: The customer ad tracking field
          type: string
          minLength: 1
          maxLength: 20
          example: ebook
        custom_fields:
          description: 'The custom fields specified on the subscriber.  Custom fields are represented
            as a sub-object where only the **values** can be modified. <br><br> **Note:** If updating
            custom field values, **all** fields must be included in the request. If all fields are not
            included, the omitted fields will be set to *null*. <br><br> In order to modify custom field
            values:

            - Retrieve the custom fields and values for the subscriber.

            - Add all fields and their values to the PATCH request.

            - Modify the value **only** for the fields you wish to update.

            - Submit the request containing all the custom fields and their respective values.'
          type: object
          additionalProperties:
            type: string
            minLength: 1
          example:
            apple: fuji
            pear: bosc
        email:
          description: The subscriber's email address
          type: string
          maximum: 50
          format: email
        last_followup_message_number_sent:
          description: The sequence number of the last followup message sent to the subscriber.  This
            field determines the next followup message to be sent to the Subscriber.  When set to 0, the
            Subscriber will receive the 1st (autoresponse) Followup message.  Set the value of this field
            to 1001 if you do not want any Followups to be sent to this Subscriber.
          type: integer
          minimum: 0
          maximum: 1001
        misc_notes:
          description: Miscellaneous notes
          type: string
          example: Open House 2015
        name:
          description: The subscriber's name
          type: string
          minLength: 1
          maxLength: 60
          example: John Doe
        status:
          description: The subscriber's status.<br> **Note** you cannot set a subscriber's status to "unconfirmed".
          type: string
          enum:
          - subscribed
          - unsubscribed
        strict_custom_fields:
          description: If this parameter is present and set to `true`, then custom field names are matched
            case sensitively.  Enabling this option also causes the operation to fail if a custom field
            is included that is not defined for the list.
          type: string
          enum:
          - 'true'
          - 'false'
        tags:
          description: An object with the keys "add" and/or "remove" and values of lists of tags
          type: object
          properties:
            add:
              description: List of tags to add to the subscriber
              type: array
              items:
                type: string
              example:
              - fast
              - lightspeed
            remove:
              description: List of tags to remove from the subscriber
              type: array
              items:
                type: string
              example:
              - slow
  securitySchemes:
    OAuth 2.0:
      description: 'The following endpoints and scopes are used to authenticate.

        '
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.aweber.com/oauth2/authorize
          tokenUrl: https://auth.aweber.com/oauth2/token
          refreshUrl: https://auth.aweber.com/oauth2/token
          scopes:
            account.read: '<br>

              Access account information and associated integrations. <br>

              <b>Required for the following endpoints:</b> get accounts, get account, get integrations,
              get integration

              '
            landing-page.read: '<br>

              Retrieve landing pages <br>

              <b>Required for the following endpoints:</b> get landing pages, get landing page

              '
            list.read: '<br>

              Retrieve lists, custom fields, tags, and sign up forms <br>

              <b>Required for the following endpoints:</b> get list, get lists, find lists, get tags for
              list, get custom fields, get custom field, get webforms for list, get split tests for list,
              get split test components, get split test component, get webforms for account, get split
              tests for account

              '
            list.write: '<br>

              Create, edit, and delete custom fields <br>

              <b>Required for the following endpoints:</b> add custom field, update custom field, delete
              custom field

              '
            subscriber.read: '<br>

              Retrieve subscribers and their activity <br>

              <b>Required for the following endpoints:</b> get subscribers, get subscriber, get subscriber
              activity, get subscribers for message, find subscribers for account, find subscribers for
              list

              '
            subscriber.write: '<br>

              Create, edit, delete, retrieve, search for, and move subscribers <br>

              <b>Required for the following endpoints:</b> add subscriber, move subscriber, update subscriber,
              delete subscriber

              '
            subscriber.read-extended: '<br>

              Previously required to retrieve subscriber PII such as name, email, IP address, etc.  This
              functionality was moved to the "subscriber.read" scope

              '
            email.read: '<br>

              Retrieve email activity related to broadcasts and follow-ups <br>

              <b>Required for the following endpoints:</b> get messages, get message, get broadcasts,
              get broadcast, get message opens, get message open, get message tracked events, get message
              tracked event, get total broadcasts, get campaigns, get campaign, find campaigns, get broadcast
              statistics, get broadcast statistic

              '
            email.write: '<br>

              Create and send email broadcasts <br>

              <b>Required for the following endpoints:</b> create broadcast, update broadcast, delete
              broadcast, cancel broadcast, schedule broadcast

              '
