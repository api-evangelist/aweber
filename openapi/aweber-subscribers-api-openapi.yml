      description: "This endpoint is used to find the collection of subscribers that\nmatch a search criteria\
        \ for the specified account across all lists.\n\n* All parameters match on the full value and\
        \ are case sensitive.\n(No partial matches are accepted)\n\n* For Date parameters, include the\
        \ date as 'YYYY-MM-DD' or 'MM-DD-YYYY'\nand any subscriber matching the query will be returned.\n\
        \n* Date parameters are entered as single days, but may search multiple days\ndepending on the\
        \ parameter. For example: `subscribed_at=2017-07-16` or\n`subscribed_before=2018-12-25`\n\n* Values\
        \ that are empty (or empty string) are treated the same as\nif they were omitted entirely.\n\n\
        * If no search parameters are included, **all subscribers from all\nlists** will be returned.\n\
