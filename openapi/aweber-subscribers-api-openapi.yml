          description: The link to the event resource (may be null)
          type: string
          format: uri
          nullable: true
        subscriber_link:
          description: The link to the [Subscriber](#tag/Subscribers/paths/~1accounts~1{accountId}~1lists~1{listId}~1subscribers~1{subscriberId}/get)
            resource
          type: string
          format: uri
        type:
          description: The type of activity
          type: string
          enum:
          - click
          - link
          - open
          - sent_message
          - subscribed
          - tracked_event
          - verified
    AddSubscriberRequestBody:
      type: object
      required:
      - email
      properties:
        ad_tracking:
          description: The customer ad tracking field
          type: string
          minLength: 1
          maxLength: 20
          example: ebook
        custom_fields:
          description: The custom fields specified on the subscriber.  Note that the custom fields are
            required to already exist for the list. See [Custom Fields](#tag/Custom-Fields) for details.
          type: object
          additionalProperties:
            type: string
            minLength: 1
          example:
            apple: fuji
            pear: bosc
        email:
          description: The subscriber's email address
          type: string
          minLength: 1
          maxLength: 50
          format: email
        ip_address:
          description: 'The subscriber''s IP address. This field is used to determine the following Geo
            Location fields: area_code, city, country, dma_code, latitude, longitude, postal_code, and
            region. IP address can only be specified when Subscribers are initially created. Internal,
            private, or reserved IP addresses are not acceptable.'
          type: string
          minLength: 1
          maxLength: 60
          format: ipv4
        last_followup_message_number_sent:
          description: The sequence number of the last followup message sent to the subscriber.  This
            field determines the next followup message to be sent to the Subscriber.  When set to 0 (default),
            the Subscriber should receive the 1st (autoresponse) Followup message.  Set the value of this
            field to 1001 if you do not want any Followups to be sent to this Subscriber.
          type: integer
          minimum: 0
          maximum: 1001
        misc_notes:
          description: Miscellaneous notes
          type: string
          minLength: 1
          maxLength: 60
        name:
          description: The subscriber's name
          type: string
          minLength: 1
          maxLength: 60
          example: John Doe
        strict_custom_fields:
          description: If this parameter is present and set to `true`, then custom field names are matched
            case sensitively.  Enabling this option also causes the operation to fail if a custom field
            is included that is not defined for the list.
          type: string
          enum:
          - 'true'
          - 'false'
        update_existing:
          description: 'If this parameter is present and set to `true`, then if a subscriber is already
            present on the list, the subscriber will be updated. <br><br> **Note:** <br>

            - Only the fields defined in the <a href=''#tag/Subscribers/paths/~1accounts~1{accountId}~1lists~1{listId}~1subscribers~1{subscriberId}/patch''>patch</a>
            endpoint will be updated.

            - Any tags in the request will be **appended** to the existing Subscriber.'
          type: string
          enum:
          - 'true'
          - 'false'
        tags:
          description: A list of tags added to the subscriber.  This field is used to apply a list of
            tags to a Subscriber. With Campaigns, you can trigger a series of messages based on what Tags
            have been applied to your subscribers.
          type: array
          items:
            type: string
          example:
          - slow
          - fast
          - lightspeed
    FindSubscribers:
      type: object
      properties:
        entries:
          description: The list of subscriber entries plus list information
          type: array
          items:
            $ref: '#/definitions/SubscriberFind'
        next_collection_link:
          description: A link to the next page of entries if more entries exist. This attribute is omitted
            from the collection if there are no more entries.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/subscribers?ws.op=find&ws.start=1&ws.size=100
        prev_collection_link:
          description: A link to the previous page of entries if previous entries exist. This attribute
            is omitted if this is the first page.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/subscribers?ws.op=find&ws.start=1&ws.size=100
        start:
          description: The starting offset for the page of entries to retrieve
          type: integer
          minimum: 0
        total_size_link:
          description: Link to the total number of entries
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/subscribers?ws.op=find&ws.show=total_size
    FindSubscribersAccount:
      type: object
      properties:
        entries:
          description: The list of subscriber entries plus list information
          type: array
          items:
            $ref: '#/definitions/SubscriberFind'
        next_collection_link:
          description: A link to the next page of entries if more entries exist. This attribute is omitted
            from the collection if there are no more entries.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/campaigns/b789/messages?ws.start=1&ws.size=100
        prev_collection_link:
          description: A link to the previous page of entries if previous entries exist. This attribute
