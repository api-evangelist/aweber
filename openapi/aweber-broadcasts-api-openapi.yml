  schemas:
    Broadcast:
      type: object
      properties:
        archive_url:
          description: The link to the broadcast archive page, only set if the broadcast was sent.
          type: string
          format: uri
          example: http://archive.aweber.com/awlist12345/9198b
        body_html:
          description: The content of the message in html format.
          type: string
          format: html
          example: <html><h1>Title</h1><body>Message body.</body></html>
        body_text:
          description: The content of the message in plain text, displayed when HTML is not supported.
          type: string
          example: This is the content of my message
        body_amp:
          description: <b>[Please read <a href="https://help.aweber.com/hc/en-us/articles/360025741194"
            target="_blank">our KB article</a> before using this field.]</b><br>The content of the message
            in AMP format.
          type: string
          format: amp
          example: <html amp4email><body>content</body></html>
        broadcast_id:
          description: The broadcast ID.
          type: integer
          example: 12345
        click_tracking_enabled:
          description: Enables links in the email message to be tracked.
          type: boolean
        clicks_collection_link:
          description: The link to this broadcasts clicks collection.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts/3456789/clicks
        created_at:
          description: When the message was created.
          type: string
          format: date-time
          example: 2015-10-23 16:19:20
        exclude_lists:
          description: List of [Lists](#tag/Lists) URLs that are excluded in the delivery of this broadcast.<br>
            This is the `self_link` of the list here - e.g. `https://api.aweber.com/1.0/accounts/<account_id>/lists/<list_id>`
          type: array
          items:
            type: string
            format: uri
          example:
          - https://api.aweber.com/1.0/accounts/123/lists/456
        facebook_integration:
          description: URL to the [Facebook broadcast integration](#tag/Integrations) to use for this
            broadcast. When the broadcast is sent, the subject of the broadcast will be posted to this
            Facebook integration  - e.g., `https://api.aweber.com/1.0/accounts/<account_id>/integrations/<integration_id>`
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/integrations/1
        has_customized_body_text:
          description: If true, the plain text field will be shown when HTML is not supported. If false,
            it will auto-generate plain text based on the HTML given.
          type: boolean
        include_lists:
          description: List of [Lists](#tag/Lists) URLs that are included in the delivery of this broadcast.<br>
            This is the `self_link` of the list here - e.g. `https://api.aweber.com/1.0/accounts/<account_id>/lists/<list_id>`
          type: array
          items:
            type: string
            format: uri
          example:
          - https://api.aweber.com/1.0/accounts/123/lists/456
        is_archived:
          description: Whether the broadcast enabled sharing via an archive url.
          type: boolean
        links:
          description: A list of links relevant to the broadcast such as RSS feeds and broadcast archives.
          type: array
          items:
            type: object
            properties:
              href:
                description: Link target
                type: string
                format: uri
                example: http://archive.aweber.com/awlist12345.rss
              rel:
                description: Link relation (`"list_archive_rss_url"`, `"list_archive_url"`, etc.)
                type: string
                example: list_archive_rss_url
          example:
          - href: http://archive.aweber.com/awlist12345.rss
            rel: list_archive_rss_url
          - href: http://archive.aweber.com/awlist12345
            rel: list_archive_url
        notify_on_send:
          description: If true, notify when stats are available on a sent broadcast message, defaults
            to true.
          type: boolean
        opens_collection_link:
          description: The link to this broadcasts opens collection.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts/3456789/opens
        scheduled_for:
          description: When broadcast is scheduled to send.
          type: string
          format: date-time
          example: 2017-11-15 10:46:07.926074-05:00
        segment_link:
          description: URL to the [Segment](#tag/Segments) to send this broadcast to.
        segment_name:
          description: The name of the segment the broadcast will be sent to, or Unknown if the segment
            no longer exists.
          type: string
          example: my_segment
        self_link:
          description: The link to this resource.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts/3456789
        sent_at:
          description: Date/Time broadcast was sent.
          type: string
          format: date-time
        stats:
          description: A list of statistics for a broadcast, only set for sent broadcasts.
          type: object
          example:
            num_complaints: 0
            num_emailed: 1
            num_undeliv: 0
            unique_clicks: 1
            unique_opens: 1
        status:
          description: The status of the broadcast.
          type: string
          enum:
          - admin_hold
          - draft
          - scheduled
          - sending
          - sent
          - unknown
        subject:
          description: The broadcast subject line.
          type: string
          maximum: 120
          example: Weekly Recipes
        twitter_integration:
          description: URL to the [Twitter broadcast integration](#tag/Integrations) to use for this broadcast.
            When the broadcast is sent, the subject of the broadcast will be tweeted - e.g., `https://api.aweber.com/1.0/accounts/<account_id>/integrations/<integration_id>`
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/integrations/2
        uuid:
          description: The broadcast UUID.
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
    BroadcastClicks:
      type: object
      properties:
        entries:
          type: array
          description: A list of aggregated click entries, showing unique clicks per subscriber with click
            statistics
          items:
            properties:
              email:
                description: Email address of the subscriber who clicked the broadcast. *Note:* This is
                  the current email address of the subscriber, not necessarily the email address the broadcast
                  was sent to.
                type: string
                example: user@example.com
              event_time:
                description: Time when the first click occurred for this subscriber
                type: string
                format: date-time
                example: 2017-07-18 16:53:02-04:00
              resource_type_link:
                description: A link to the click type
                type: string
                example: https://api.aweber.com/1.0/#click
              subscriber_link:
                description: The link to the subscriber entry
                type: string
                example: https://api.aweber.com/1.0/accounts/123/lists/456/subscribers/789
              type:
                description: Type of subscriber activity
                type: string
                enum:
                - click
              first_click_at:
                description: Time of the first click by this subscriber
                type: string
                format: date-time
                example: 2025-04-30 11:48:29-04:00
              last_click_at:
                description: Time of the last click by this subscriber
                type: string
                format: date-time
                example: 2025-04-30 12:03:09-04:00
              total_clicks:
                description: Total number of clicks by this subscriber
                type: integer
                minimum: 1
                example: 4
        next_collection_link:
          description: A link to the next page of entries if more entries exist. This attribute is omitted
            from the collection if there are no more entries.
          type: string
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts/789/clicks?after=MjAyMC0wOS0wNCAxODozMzozNCswMDowMCw0NDk%3D
        prev_collection_link:
          description: A link to the previous page of entries if any exist.
          type: string
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts/789/clicks?before=MjAyMC0wOS0wNCAxODozMzozNCswMDowMCw0NDk%3D
        resource_type_link:
          description: A link that identifies the type of resource that this collection represents
          type: string
          example: https://api.aweber.com/1.0/#click-page-resource
        total_size:
          description: The total number of unique subscribers who clicked the broadcast
          type: integer
          minimum: 0
          example: 10
    BroadcastClicksDetailed:
      type: object
      properties:
        entries:
          type: array
          description: A list of individual click event entries, showing each click occurrence with the
            specific URL
          items:
            properties:
              email:
                description: Email address of the subscriber who clicked the broadcast. *Note:* This is
                  the current email address of the subscriber, not necessarily the email address the broadcast
                  was sent to.
                type: string
                example: user@example.com
              event_time:
                description: Time when this individual click event occurred (same value as clicked_at)
                type: string
                format: date-time
                example: 2025-04-30 11:48:29-04:00
              resource_type_link:
                description: A link to the click type
                type: string
                example: https://api.aweber.com/1.0/#click
              subscriber_link:
                description: The link to the subscriber entry
                type: string
                example: https://api.aweber.com/1.0/accounts/123/lists/456/subscribers/789
              type:
                description: Type of subscriber activity
                type: string
                enum:
                - click
              clicked_at:
                description: Timestamp of when this specific click occurred
                type: string
                format: date-time
                example: 2025-04-30 11:48:29-04:00
              url:
                description: The URL that was clicked
                type: string
                format: uri
                example: https://example.com/page
        next_collection_link:
          description: A link to the next page of entries if more entries exist. This attribute is omitted
            from the collection if there are no more entries.
          type: string
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts/789/clicks?after=MjAyMC0wOS0wNCAxODozMzozNCswMDowMCw0NDk%3D&detailed=true
        prev_collection_link:
          description: A link to the previous page of entries if any exist.
          type: string
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts/789/clicks?before=MjAyMC0wOS0wNCAxODozMzozNCswMDowMCw0NDk%3D&detailed=true
        resource_type_link:
          description: A link that identifies the type of resource that this collection represents
          type: string
          example: https://api.aweber.com/1.0/#click-page-resource
        total_size:
          description: The total number of individual click events (can be higher than unique subscribers
            if some clicked multiple times)
          type: integer
          minimum: 0
          example: 15
    BroadcastOpens:
      type: object
      properties:
        entries:
          type: array
          description: A list of entries
          items:
            properties:
              email:
                description: Email address of the subscriber who opened the broadcast. *Note:* This is
                  the current email address of the subscriber, not necessarily the email address the broadcast
                  was sent to.
                type: string
                example: user@example.com
              event_time:
