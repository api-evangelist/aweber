                description: The link to this resource.
                type: string
                format: uri
                example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts/3456789
              status:
                description: The status of the broadcast.
                type: string
                enum:
                - draft
                - scheduled
                - sent
                example: sent
              scheduled_for:
                description: When broadcast is scheduled to send.
                type: string
                format: date-time
                example: 2017-11-15 10:46:07.926074-05:00
              sent_at:
                description: Date/Time broadcast was sent.
                type: string
                format: date-time
                example: 2017-11-15 14:26:36.210647-05:00
              subject:
                description: The broadcast subject line.
                type: string
                maximum: 120
                example: Weekly Recipes
        next_collection_link:
          description: A link to the next page of entries if more entries exist. This attribute is omitted
            from the collection if there are no more entries.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts?status=sent&ws.size=1&ws.start=1
        prev_collection_link:
          description: A link to the previous page of entries if previous entries exist. This attribute
            is omitted if this is the first page.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts?status=sent&ws.size=1&ws.start=0
        resource_type_link:
          description: A link that identifies the type of resource that this collection represents.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/#broadcast-page-resource
        self_link:
          description: A link to the current page of entries.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts?status=sent&ws.size=1&ws.start=0
        start:
          description: The starting offset for the page of entries to retrieve.
          type: integer
          minimum: 0
        total_size_link:
          description: A link to a resource that provides the total number of broadcasts in the collection.
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/lists/456/broadcasts/total?status=draft
    CreateBroadcast:
      type: object
      required:
      - body_html
      - body_text
      - subject
      properties:
        body_html:
          description: The content of the message in html format. If body_text is not provided, it will
            be auto-generated. If body_text is not provided, body_html must be provided.
          type: string
          format: html
          example: <html><h1>Title</h1><body>Message body.</body></html>
        body_text:
          description: The content of the message in plain text, used when HTML is not supported. If body_html
            is not provided, the broadcast will be sent using only the body_text. If body_text is not
            provided, body_html must be provided.
          type: string
          example: This is the content of my message
        body_amp:
          description: <b>[Please read <a href="https://help.aweber.com/hc/en-us/articles/360025741194"
            target="_blank">our KB article</a> before using this field.]</b><br>The content of the message
            in AMP format.
          type: string
          format: amp
          example: <html amp4email><body>content</body></html>
        click_tracking_enabled:
          description: Enables links in the email message to be tracked
          default: true
          type: boolean
        exclude_lists:
          description: JSON encoded list of [Lists](#tag/Lists) URLs to exclude in the delivery of this
            broadcast.<br> Use the `self_link` of the list here - e.g. `https://api.aweber.com/1.0/accounts/<account_id>/lists/<list_id>`.
            If updated, this value will replace the existing excluded_lists.
          default: []
          type: string
          example: '["https://api.aweber.com/1.0/accounts/123/lists/456"]'
        include_lists:
          description: JSON encoded list of [Lists](#tag/Lists) URLs to include in the delivery of this
            broadcast.<br> Use the `self_link` of the list here - e.g. `https://api.aweber.com/1.0/accounts/<account_id>/lists/<list_id>`.
            If updated, this value will replace the existing included_lists.
          default: []
          type: string
          example: '["https://api.aweber.com/1.0/accounts/123/lists/456"]'
        facebook_integration:
          description: URL to the [Facebook broadcast integration](#tag/Integrations) to use for this
            broadcast. When the broadcast is sent, the subject of the broadcast will be posted to this
            Facebook integration  - e.g., `https://api.aweber.com/1.0/accounts/<account_id>/integrations/<integration_id>`
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/integrations/1
        is_archived:
          description: Whether the broadcast enabled sharing via an archive url
          default: true
          type: boolean
        notify_on_send:
          description: If true, notify when stats are available on a sent broadcast message
          default: true
          type: boolean
        segment_link:
          description: 'URL to the [Segment](#tag/Segments) to send this broadcast to.  Use the `self_link`
            of the

            segment here - e.g.

            `https://api.aweber.com/1.0/accounts/<account_id>/lists/<list_id>/segments/<segment_id>`.

            If not specified, the broadcast will be sent to the “Active Subscribers” segment.

            '
        subject:
          description: The broadcast subject line. Subject must not be empty nor contain only whitespace.
          type: string
          maximum: 120
          example: Weekly Recipes
        twitter_integration:
          description: URL to the [Twitter broadcast integration](#tag/Integrations) to use for this broadcast.
            When the broadcast is sent, the subject of the broadcast will be tweeted - e.g., `https://api.aweber.com/1.0/accounts/<account_id>/integrations/<integration_id>`
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/integrations/2
    ScheduleBroadcast:
      type: object
      required:
      - scheduled_for
      properties:
        scheduled_for:
          description: Scheduled time for sending broadcast message, ISO-8601 formatted.
          type: string
          format: date-time
          example: 2017-07-18 16:53:02-04:00
    UpdateBroadcast:
      type: object
      properties:
        body_html:
          description: The content of the message in html format. If body_text is not provided, it will
            be auto-generated.
          type: string
          format: html
          example: <html><h1>Title</h1><body>Message body.</body></html>
        body_text:
          description: The content of the message in plain text, used when HTML is not supported. If body_html
            is not provided, the broadcast will be sent using only the body_text.
          type: string
          example: This is the content of my message
        body_amp:
          description: <b>[Please read <a href="https://help.aweber.com/hc/en-us/articles/360025741194"
            target="_blank">our KB article</a> before using this field.]</b><br>The content of the message
            in AMP format.
          type: string
          format: amp
          example: <html amp4email><body>content</body></html>
        click_tracking_enabled:
          description: Enables links in the email message to be tracked.
          type: boolean
        exclude_lists:
          description: JSON encoded list of [Lists](#tag/Lists) URLs to exclude in the delivery of this
            broadcast.<br> Use the `self_link` of the list here - e.g. `https://api.aweber.com/1.0/accounts/<account_id>/lists/<list_id>`.
            If updated, this value will replace the existing excluded_lists.
          default: []
          type: string
          example: '["https://api.aweber.com/1.0/accounts/123/lists/456"]'
        include_lists:
          description: JSON encoded list of [Lists](#tag/Lists) URLs to include in the delivery of this
            broadcast.<br> Use the `self_link` of the list here - e.g. `https://api.aweber.com/1.0/accounts/<account_id>/lists/<list_id>`.
            If updated, this value will replace the existing included_lists.
          default: []
          type: string
          example: '["https://api.aweber.com/1.0/accounts/123/lists/456"]'
        facebook_integration:
          description: URL to the [Facebook broadcast integration](#tag/Integrations) to use for this
            broadcast. When the broadcast is sent, the subject of the broadcast will be posted to this
            Facebook integration  - e.g., `https://api.aweber.com/1.0/accounts/<account_id>/integrations/<integration_id>`
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/integrations/1
        is_archived:
          description: Whether the broadcast enabled sharing via an archive url.
          type: boolean
        notify_on_send:
          description: If true, notify when stats are available on a sent broadcast message, defaults
            to true.
          type: boolean
        subject:
          description: The broadcast subject line. Subject must not be empty nor contain only whitespace.
          type: string
          maximum: 120
          example: Weekly Recipes
        twitter_integration:
          description: URL to the [Twitter broadcast integration](#tag/Integrations) to use for this broadcast.
            When the broadcast is sent, the subject of the broadcast will be tweeted - e.g., `https://api.aweber.com/1.0/accounts/<account_id>/integrations/<integration_id>`
          type: string
          format: uri
          example: https://api.aweber.com/1.0/accounts/123/integrations/2
        segment_link:
          description: URL to the [Segment](#tag/Segments) to send this broadcast to.  Use the `self_link`
            of the segment here - e.g. `https://api.aweber.com/1.0/accounts/<account_id>/lists/<list_id>/segments/<segment_id>`.
            If not specified, the broadcast will be sent to the “Active Subscribers” segment.
          type: string
          format: url
          example: https://api.aweber.com/1.0/accounts/123/lists/456/segments/1
  securitySchemes:
    OAuth 2.0:
      description: 'The following endpoints and scopes are used to authenticate.

        '
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.aweber.com/oauth2/authorize
          tokenUrl: https://auth.aweber.com/oauth2/token
          refreshUrl: https://auth.aweber.com/oauth2/token
          scopes:
            account.read: '<br>

              Access account information and associated integrations. <br>

              <b>Required for the following endpoints:</b> get accounts, get account, get integrations,
              get integration

              '
            landing-page.read: '<br>

              Retrieve landing pages <br>

              <b>Required for the following endpoints:</b> get landing pages, get landing page

              '
            list.read: '<br>

              Retrieve lists, custom fields, tags, and sign up forms <br>

              <b>Required for the following endpoints:</b> get list, get lists, find lists, get tags for
              list, get custom fields, get custom field, get webforms for list, get split tests for list,
              get split test components, get split test component, get webforms for account, get split
              tests for account

              '
            list.write: '<br>

              Create, edit, and delete custom fields <br>

              <b>Required for the following endpoints:</b> add custom field, update custom field, delete
              custom field

              '
            subscriber.read: '<br>

              Retrieve subscribers and their activity <br>

              <b>Required for the following endpoints:</b> get subscribers, get subscriber, get subscriber
              activity, get subscribers for message, find subscribers for account, find subscribers for
              list

              '
            subscriber.write: '<br>

              Create, edit, delete, retrieve, search for, and move subscribers <br>

              <b>Required for the following endpoints:</b> add subscriber, move subscriber, update subscriber,
              delete subscriber

              '
            subscriber.read-extended: '<br>

              Previously required to retrieve subscriber PII such as name, email, IP address, etc.  This
              functionality was moved to the "subscriber.read" scope

              '
            email.read: '<br>

              Retrieve email activity related to broadcasts and follow-ups <br>

              <b>Required for the following endpoints:</b> get messages, get message, get broadcasts,
              get broadcast, get message opens, get message open, get message tracked events, get message
              tracked event, get total broadcasts, get campaigns, get campaign, find campaigns, get broadcast
              statistics, get broadcast statistic

              '
            email.write: '<br>

              Create and send email broadcasts <br>

              <b>Required for the following endpoints:</b> create broadcast, update broadcast, delete
              broadcast, cancel broadcast, schedule broadcast

              '
