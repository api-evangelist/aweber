  /accounts/{accountId}/lists/{listId}/broadcasts/{broadcastId}/clicks:
    get:
      summary: Get broadcast clicks
      description: 'This endpoint is used to retrieve a broadcast message''s clicks.

        By default, returns aggregated click data showing the first click per subscriber along with click
        statistics. When detailed=true, returns individual click events including the specific URLs that
        were clicked.

        Results are returned in most recent order by event_time.

        The subscriber''s email address will only be returned if the token has the `subscriber.read` scope.'
      tags:
      - Broadcasts
      parameters:
      - $ref: '#/components/parameters/accountId'
      - $ref: '#/components/parameters/listId'
      - $ref: '#/components/parameters/broadcastId'
      - $ref: '#/components/parameters/before'
      - $ref: '#/components/parameters/after'
      - $ref: '#/components/parameters/pageSize'
      - name: detailed
        in: query
        description: When true, returns individual click events with URLs instead of aggregated click
          data per subscriber
        required: false
        schema:
          type: boolean
          default: false
      security:
      - OAuth 2.0:
        - email.read
      x-code-samples:
      - lang: Shell
        source: "# Get aggregated clicks (default - shows unique clicks per subscriber with statistics)\n\
          curl -G \\\n  https://api.aweber.com/1.0/accounts/{accountId}/lists/{listId}/broadcasts/{broadcastId}/clicks\
          \ \\\n  -H 'Authorization: Bearer {YOUR_ACCESS_TOKEN}'\n\n# Get detailed clicks (shows individual\
          \ click events with URLs)\ncurl -G \\\n  https://api.aweber.com/1.0/accounts/{accountId}/lists/{listId}/broadcasts/{broadcastId}/clicks\
          \ \\\n  -d 'detailed=true' \\\n  -H 'Authorization: Bearer {YOUR_ACCESS_TOKEN}'\n"
      - lang: Python
        source: "headers = {'Accept': 'application/json',\n           'User-Agent': 'AWeber-Python-code-sample/1.0',\n\
          \           'Authorization': f'Bearer {access_token}'}\nurl = (f'https://api.aweber.com/1.0/accounts/{account_id}'\n\
          \       f'/lists/{list_id}/broadcasts/{broadcast_id}/clicks')\n\n# Get aggregated clicks (default\
          \ - shows unique clicks per subscriber with statistics)\nresponse = requests.get(url, headers=headers)\n\
          print(\"Aggregated clicks:\", response.json())\n\n# Get detailed clicks (shows individual click\
          \ events with URLs)\nparams = {'detailed': 'true'}\nresponse = requests.get(url, headers=headers,\
          \ params=params)\nprint(\"Detailed clicks:\", response.json())\n"
      - lang: PHP
        source: "$headers = [\n    'User-Agent' => 'AWeber-PHP-code-sample/1.0',\n    'Accept' => 'application/json',\n\
          \    'Authorization' => 'Bearer $token',\n];\n\n// Get aggregated clicks (default - shows unique\
          \ clicks per subscriber with statistics)\n$url = \"https://api.aweber.com/1.0/accounts/{$accountId}/lists/{$listId}/broadcasts/{$broadcastId}/clicks\"\
          ;\n$response = $client->get($url, ['headers' => $headers]);\n$body = json_decode($response->getBody(),\
          \ true);\necho \"Aggregated clicks:\\n\";\nprint_r($body);\n\n// Get detailed clicks (shows\
          \ individual click events with URLs)\n$urlDetailed = \"https://api.aweber.com/1.0/accounts/{$accountId}/lists/{$listId}/broadcasts/{$broadcastId}/clicks?detailed=true\"\
          ;\n$response = $client->get($urlDetailed, ['headers' => $headers]);\n$body = json_decode($response->getBody(),\
          \ true);\necho \"Detailed clicks:\\n\";\nprint_r($body);\n"
      - lang: C#
        source: '// Get aggregated clicks (default - shows unique clicks per subscriber with statistics)

          const string url = "https://api.aweber.com/1.0/accounts/{accountId}/lists/{listId}/broadcasts/{broadcastId}/clicks";

          var request = new HttpRequestMessage(HttpMethod.Get, url);

          request.Headers.Add("Accept","application/json");

          request.Headers.Add("User-Agent","AWeber-CSharp-code-sample/1.0");

          request.Headers.Add("Authorization", $"Bearer {Token}");

          var response = await Client.SendAsync(request);

          Console.WriteLine("Aggregated clicks:");

          Console.WriteLine(await response.Content.ReadAsStringAsync());


          // Get detailed clicks (shows individual click events with URLs)

          const string urlDetailed = "https://api.aweber.com/1.0/accounts/{accountId}/lists/{listId}/broadcasts/{broadcastId}/clicks?detailed=true";

          var requestDetailed = new HttpRequestMessage(HttpMethod.Get, urlDetailed);

          requestDetailed.Headers.Add("Accept","application/json");

          requestDetailed.Headers.Add("User-Agent","AWeber-CSharp-code-sample/1.0");

          requestDetailed.Headers.Add("Authorization", $"Bearer {Token}");

          var responseDetailed = await Client.SendAsync(requestDetailed);

          Console.WriteLine("Detailed clicks:");

          Console.WriteLine(await responseDetailed.Content.ReadAsStringAsync());

          '
      - lang: JavaScript
        label: Node.js
        source: "const headers = {\n  \"Accept\": \"application/json\",\n  \"User-Agent\": \"AWeber-Node-code-sample/1.0\"\
          ,\n  \"Authorization\": `Bearer ${accessToken}`\n};\n\n// Get aggregated clicks (default - shows\
          \ unique clicks per subscriber with statistics)\nconst url = `https://api.aweber.com/1.0/accounts/${accountId}/lists/${listId}/broadcasts/${broadcastId}/clicks`;\n\
          fetch(url, { headers: headers })\n  .then(response => response.json())\n  .then(data => {\n\
          \      console.log(\"Aggregated clicks:\", data)\n  })\n\n// Get detailed clicks (shows individual\
          \ click events with URLs)\nconst urlDetailed = `https://api.aweber.com/1.0/accounts/${accountId}/lists/${listId}/broadcasts/${broadcastId}/clicks?detailed=true`;\n\
          fetch(urlDetailed, { headers: headers })\n  .then(response => response.json())\n  .then(data\
          \ => {\n      console.log(\"Detailed clicks:\", data)\n  })\n"
      - lang: Ruby
        source: "headers = {\n  'Accept': 'application/json',\n  'User-Agent': 'AWeber-Ruby-code-sample/1.0',\n\
          \  'Authorization': \"Bearer #{access_token}\"\n}\n\n# Get aggregated clicks (default - shows\
          \ unique clicks per subscriber with statistics)\nresponse = Faraday.get(\n  \"https://api.aweber.com/1.0/accounts/#{account_id}/\"\
          \ \\\n  \"lists/#{list_id}/broadcasts/#{broadcast_id}/clicks\",\n) do |req|\n  req.headers =\
          \ headers\nend\nputs \"Aggregated clicks:\"\nputs response.body\n\n# Get detailed clicks (shows\
          \ individual click events with URLs)\nresponse_detailed = Faraday.get(\n  \"https://api.aweber.com/1.0/accounts/#{account_id}/\"\
          \ \\\n  \"lists/#{list_id}/broadcasts/#{broadcast_id}/clicks\",\n) do |req|\n  req.headers =\
          \ headers\n  req.params['detailed'] = 'true'\nend\nputs \"Detailed clicks:\"\nputs response_detailed.body\n"
      responses:
        '200':
          description: The request completed successfully
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BroadcastClicks'
                - $ref: '#/components/schemas/BroadcastClicksDetailed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/RateLimitOrEmailPermission'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/BlockedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      operationId: getBroadcastClicks
