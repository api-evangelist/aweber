features:
  - name: Email Broadcasts
    description: >-
      Create, schedule, and send broadcast emails to lists or segments with
      drag-and-drop editor and HTML support.
  - name: Drip Campaigns
    description: >-
      Build automated drip campaigns and follow-up sequences triggered by
      subscriber activity and tags.
  - name: Subscriber Management
    description: >-
      Add, update, segment, and tag subscribers across multiple lists with
      custom fields and activity history.
  - name: Landing Pages
    description: >-
      Build mobile-responsive landing pages with templates, A/B testing, and
      built-in lead capture forms.
  - name: Sign-Up Forms
    description: >-
      Embed customizable sign-up forms and pop-ups on any website to grow
      mailing lists.
  - name: Analytics and Reporting
    description: >-
      Track opens, clicks, deliverability, and subscriber growth with detailed
      reporting per campaign.
  - name: Webhooks
    description: >-
      Subscribe to subscriber, campaign, and broadcast events via webhooks for
      real-time integrations.
useCases:
  - name: Newsletter Publishing
    description: >-
      Publish recurring newsletters to engaged subscribers with template
      reuse and segmentation.
  - name: Lead Nurturing
    description: >-
      Run automated email sequences to nurture leads from sign-up through
      conversion using drip campaigns.
  - name: E-commerce Email Marketing
    description: >-
      Send promotional broadcasts, cart-abandonment sequences, and product
      recommendations integrated with stores.
  - name: Audience Growth
    description: >-
      Capture leads via landing pages and embedded sign-up forms with
      double opt-in workflows.
integrations:
  - name: WordPress
    description: Sync sign-up forms and subscribers between WordPress and AWeber
  - name: Shopify
    description: Sync e-commerce customers and trigger automations
  - name: Zapier
    description: Connect AWeber to thousands of apps via Zapier triggers and actions
  - name: PayPal
    description: Add buyers to lists and trigger campaigns from PayPal events
  - name: Facebook
    description: Sync Facebook Lead Ads with AWeber lists
