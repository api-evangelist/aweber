aid: aweber
name: AWeber
description: >-
  AWeber is an email marketing and automation platform for small businesses,
  creators, and entrepreneurs providing email broadcasts, drip campaigns,
  landing pages, sign-up forms, and subscriber management. The AWeber REST API
  at api.aweber.com offers full programmatic access to lists, subscribers,
  broadcasts, campaigns, custom fields, segments, and tags using OAuth 2.0
  authentication.
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: true
  trial_days: 14
  try_now: false
  public: false
  label: Self-serve signup, free developer account, paid customer account
  confidence: high
  source:
  - https://www.aweber.com/pricing.htm
  - https://labs.aweber.com
  - authentication
  note: >-
    Two separate registrations. The developer account at labs.aweber.com is free and issues the
    OAuth client credentials; the data belongs to a paid AWeber customer account (Lite $15/mo,
    Plus $30/mo, 14-day trial). API access itself is not priced or gated by tier.
  generated: '2026-08-13'
  method: searched
