aid: aweber
name: AWeber
description: >-
  AWeber is an email marketing and automation platform for small businesses,
  creators, and entrepreneurs providing email broadcasts, drip campaigns,
  landing pages, sign-up forms, and subscriber management. The AWeber REST API
  at api.aweber.com offers full programmatic access to lists, subscribers,
  broadcasts, campaigns, custom fields, segments, and tags using OAuth 2.0
  authentication.
