    name: AWeber REST API
    description: >-
      REST API for managing AWeber accounts, lists, subscribers, broadcasts,
      campaigns, custom fields, segments, and tags. Authentication uses OAuth
      2.0 with personal access tokens or the authorization code flow.
    humanURL: https://developer.aweber.com/docs/v3
    baseURL: https://api.aweber.com/1.0
