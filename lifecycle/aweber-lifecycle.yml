  note: >-
    AWeber publishes NO deprecation policy: no notice period, no Sunset/Deprecation header
    support (RFC 8594), no deprecated flag on any operation in the OpenAPI. Removals are
    announced only as changelog entries, sometimes after the fact — API 1.3.0 (2025-05-06)
