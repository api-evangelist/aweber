  package: null
  auth: oauth
  verified: probed
  note: >-
    mode=none: nobody ships a server. auth records what a server WOULD need — the AWeber REST
    API is OAuth 2.0 authorization-code only (PKCE for public clients), so any MCP server would
    have to carry a per-AWeber-customer token; there is no API-key path.
