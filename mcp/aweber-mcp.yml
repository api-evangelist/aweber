  only .gitignore, LICENSE and a 62-byte README. There is no server implementation, no package,
  no manifest and no endpoint. A pointer at that repository would credit AWeber with an agent
  surface that does not exist, so the tools below are recorded as a DERIVED CANDIDATE from
  AWeber's own OpenAPI, not as a published server.
deployment:
