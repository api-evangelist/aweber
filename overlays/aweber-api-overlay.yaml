extends: openapi/_original/aweber-api-openapi.yml
x-generated: '2026-08-13'
x-method: generated
x-note: AWeber publishes its OpenAPI 3.0.2 across 34 files at api.aweber.com; the bundled copy in openapi/_original/
  is that spec with every external $ref resolved and nothing else changed. The published spec assigns
  an operationId to exactly ONE of its 57 operations (getBroadcastLinksAnalytics), which leaves 56 operations
  unaddressable by name — no SDK generator, MCP tool binding or Arazzo workflow can reference them. This
  overlay records the operationIds API Evangelist derived deterministically from AWeber's own operation
  summaries (e.g. summary "Get subscribers" -> getSubscribers) and applied to the refined per-tag specs
  in openapi/. It is the complete diff between what AWeber ships and what this repo serves; reversing
  it returns the provider document exactly. It also carries the catalog metadata added at info level.
